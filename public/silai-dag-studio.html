<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="referrer" content="no-referrer"/>
<title>Silai · DAG Studio</title>
<script>
/* Background theme: the studio's own saved choice, else RoopVana's theme (same site),
   else dark, which was the only theme before. */
(function(){
  var t='dark';
  try{
    var own=localStorage.getItem('silai.theme');
    var rv=localStorage.getItem('roopvana-theme');
    if(rv==='system') rv=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
    t=(own==='light'||own==='dark')?own:((rv==='light'||rv==='dark')?rv:'dark');
  }catch(e){}
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d0d0f;--surface:#151519;--panel:#1b1b21;--panel2:#212129;--border:#26262f;--border-soft:#1f1f26;
    --accent:#f59e0b;--accent2:#fbbf24;--accent-dim:rgba(245,158,11,.12);
    --red:#f0524a;--blue:#4a90f5;--green:#2fc774;--purple:#b062f2;
    --text:#eeeef4;--text2:#9393a8;--text3:#57576a;
    --grid:#20202a;--sheet-fill:rgba(245,158,11,.05);--sheet-stroke:#33333d;--gm-fill:rgba(210,232,255,.05);--gm-line:#3a3a44;
    --halo:#0d0d0f;--aform:#a6a6bd;--dimtxt:#f0f1f8;--anchor-stroke:#000;--on-accent:#000;
    --paper:#0d0d0f;--shadow-lg:rgba(0,0,0,.4);--shadow-md:rgba(0,0,0,.35);--shadow-menu:rgba(0,0,0,.5);--sew-bg:rgba(47,199,116,.08);--warn-bg:rgba(240,82,74,.09);
    --ease:cubic-bezier(.22,.85,.32,1);--ease-fast:cubic-bezier(.3,.9,.4,1);
    --radius:12px;--radius-sm:8px;
  }
  /* White background. Colours are darker than in the dark theme so thin lines, letters and
     highlights keep their contrast on white; label halos turn white instead of black. */
  html[data-theme="light"]{
    color-scheme:light;
    --bg:#f4f4f7;--surface:#ffffff;--panel:#f3f3f7;--panel2:#ffffff;--border:#dcdce4;--border-soft:#e9e9ef;
    --accent:#d97706;--accent2:#b45309;--accent-dim:rgba(217,119,6,.10);
    --red:#dc2626;--blue:#2563eb;--green:#15803d;--purple:#7e22ce;
    --text:#1b1b24;--text2:#4b4b5e;--text3:#a3a3b3;
    --grid:#eeeef3;--sheet-fill:rgba(217,119,6,.035);--sheet-stroke:#d2d2dc;--gm-fill:rgba(37,99,235,.045);--gm-line:#a7a7b6;
    --halo:#ffffff;--aform:#5c5c70;--dimtxt:#1b1b24;--anchor-stroke:#ffffff;--on-accent:#ffffff;
    --paper:#ffffff;--shadow-lg:rgba(30,30,60,.10);--shadow-md:rgba(30,30,60,.08);--shadow-menu:rgba(30,30,60,.16);--sew-bg:rgba(21,128,61,.07);--warn-bg:rgba(220,38,38,.07);
  }
  html[data-theme="light"] .anchor.dim{opacity:.7}
  /* the coloured glow on new lines looks muddy on white: use a soft neutral lift instead */
  html[data-theme="light"] #stage [filter], html[data-theme="light"] #garment [filter]{filter:drop-shadow(0 1px 1.2px rgba(20,20,40,.22))}
  html[data-theme="light"] .alabel.dim{opacity:.9}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:2px solid var(--surface)}
  ::-webkit-scrollbar-thumb:hover{background:var(--text3)}

  header{height:56px;background:linear-gradient(180deg,var(--surface),var(--bg));border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:14px;flex-shrink:0;backdrop-filter:blur(6px)}
  .logo{font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--accent)}
  .logo span{color:var(--text2);font-weight:400}

  .switch{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:3px;gap:1px}
  .sw-btn{padding:7px 13px;border:none;background:none;color:var(--text2);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;border-radius:8px;transition:background .22s var(--ease),color .22s var(--ease),transform .15s var(--ease-fast);white-space:nowrap}
  .sw-btn:hover{color:var(--text)}
  .sw-btn.active{background:var(--accent);color:var(--on-accent);box-shadow:0 2px 10px rgba(245,158,11,.35)}
  .sw-btn:active{transform:scale(.96)}

  .tag{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;border:1px solid var(--border);padding:4px 9px;border-radius:6px}
  .spacer{margin-left:auto}

  /* names toggle — pill switch */
  .names-toggle{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--panel);padding:5px 10px 5px 5px;border-radius:20px;cursor:pointer;color:var(--text2);font-family:inherit;font-size:11.5px;font-weight:600;transition:border-color .2s var(--ease),color .2s var(--ease)}
  .names-toggle:hover{border-color:var(--accent);color:var(--text)}
  .nt-track{width:30px;height:17px;border-radius:20px;background:var(--bg);border:1px solid var(--border);position:relative;transition:background .22s var(--ease)}
  .nt-thumb{position:absolute;top:1px;left:1px;width:13px;height:13px;border-radius:50%;background:var(--text3);transition:transform .24s var(--ease),background .22s var(--ease)}
  .names-toggle.on .nt-track{background:rgba(245,158,11,.18);border-color:var(--accent)}
  .names-toggle.on .nt-thumb{transform:translateX(13px);background:var(--accent)}
  .names-toggle.on{color:var(--accent2)}

  /* Custom language switcher — our own styled dropdown, no Google banner or
     cross-origin iframe involved. Translates only the instruction panel
     (the "How to draft & sew" text), via a plain fetch call. */
  .lang-wrap{position:relative;display:flex;align-items:center}
  .lang-toggle{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--text2);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:border-color .18s var(--ease),color .18s var(--ease)}
  .lang-toggle:hover{border-color:var(--accent);color:var(--text)}
  .lang-wrap.open .lang-toggle{border-color:var(--accent);color:var(--accent2)}
  .lang-caret{font-size:9px;color:var(--text3);transition:transform .18s var(--ease)}
  .lang-wrap.open .lang-caret{transform:rotate(180deg)}
  .lang-menu{position:fixed;z-index:80;display:none;
    max-height:290px;overflow-y:auto;background:var(--panel2);border:1px solid var(--border);
    border-radius:11px;padding:6px;box-shadow:0 14px 34px var(--shadow-menu);
    opacity:0;transform:translateY(-4px);transition:opacity .16s var(--ease),transform .16s var(--ease)}
  .lang-wrap.open .lang-menu{display:block;opacity:1;transform:none}
  .lang-menu.open{display:block;opacity:1;transform:none}
  .lang-opt{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:7px;border:none;background:none;color:var(--text2);font-family:inherit;font-size:12.5px;cursor:pointer;transition:background .13s var(--ease)}
  .lang-opt:hover{background:var(--panel)}
  .lang-opt.active{background:var(--accent-dim);color:var(--accent2);font-weight:600}
  .lang-loading{opacity:.6;pointer-events:none}

  .progress-rail{height:2.5px;background:var(--border-soft);flex-shrink:0}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .38s var(--ease)}

  .app{display:flex;flex:1;overflow:hidden}
  aside.dag{width:314px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;padding:14px 0}
  .dag-title{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--text3);font-weight:600;padding:0 18px 10px}
  .phase-hdr{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:700;padding:14px 18px 7px;display:flex;align-items:center;gap:8px}
  .phase-hdr .pl{height:1px;flex:1;background:var(--border)}

  .node{position:relative;margin:0 12px 4px;padding:11px 12px 11px 44px;border-radius:var(--radius-sm);cursor:pointer;transition:background .18s var(--ease),border-color .18s var(--ease),transform .12s var(--ease-fast);border:1px solid transparent}
  .node:hover{background:var(--panel);transform:translateX(1px)}
  .node.active{background:var(--accent-dim);border-color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}
  .node.done .num{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .node.locked{opacity:.45}
  .num{position:absolute;left:12px;top:11px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--text2);z-index:2;transition:background .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease)}
  .node.active .num{border-color:var(--accent);color:var(--accent)}
  .node::before{content:'';position:absolute;left:22.5px;top:-4px;width:1.5px;height:15px;background:var(--border)}
  .node.first::before{display:none}
  .node .hi{font-size:13px;font-weight:600;color:var(--text);line-height:1.3}
  .node .formula{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);opacity:.9;margin-top:6px;max-height:0;overflow:hidden;transition:max-height .22s var(--ease),margin-top .22s var(--ease)}
  .node.active .formula{display:block;max-height:40px;margin-top:6px}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
  .chip{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 6px;border-radius:5px;background:var(--bg);border:1px solid var(--border);color:var(--text3)}
  .chip.dep{color:var(--blue);border-color:rgba(74,144,245,.35)}
  .chip.man{color:var(--purple);border-color:rgba(176,98,242,.4)}
  .chip.cross{color:var(--green);border-color:rgba(47,199,116,.4)}
  .badge-man{position:absolute;right:11px;top:11px;font-size:11px;color:var(--purple)}

  main{flex:1;display:flex;flex-direction:column;background:
       radial-gradient(circle at 30% 0%,rgba(245,158,11,.04),transparent 45%) , var(--bg);overflow:hidden}
  .canvas-wrap{flex:1.35;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:26px;
    background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:22px 22px}
  .stage-row{flex:1;display:flex;overflow:hidden;border-bottom:1px solid var(--border)}
  .preview-wrap{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:22px 26px;gap:12px;border-left:1px solid var(--border);
    background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px);background-size:22px 22px}
  .preview-title{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--text3);font-weight:600}
  .preview-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;
    box-shadow:0 18px 44px var(--shadow-md);display:flex;align-items:center;justify-content:center;overflow:hidden;
    transition:width .38s var(--ease),height .38s var(--ease)}
  .canvas-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;
    box-shadow:0 22px 55px var(--shadow-lg),inset 0 1px 0 rgba(255,255,255,.02);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    transition:width .38s var(--ease),height .38s var(--ease)}
  #stage{width:100%;height:100%;display:block}

  @keyframes stepIn{from{opacity:.35;transform:translateY(5px) scale(.995)}to{opacity:1;transform:none}}
  .step-in{animation:stepIn .34s var(--ease)}

  .controls{height:58px;border-top:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:12px;padding:0 18px;flex-shrink:0}
  .step-readout{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text2)}
  .step-readout b{color:var(--accent)}
  .dots{display:flex;gap:5px;margin:0 6px;flex-wrap:wrap;max-width:280px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--border);cursor:pointer;transition:background .18s var(--ease),transform .15s var(--ease-fast)}
  .dot:hover{transform:scale(1.3)}
  .dot.on{background:var(--accent);box-shadow:0 0 0 3px rgba(245,158,11,.2)}
  .dot.done{background:var(--text3)}
  .dot.sep{margin-left:7px}

  .btn{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:border-color .18s var(--ease),color .18s var(--ease),transform .12s var(--ease-fast)}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn:active{transform:scale(.96)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .btn.primary:hover{background:var(--accent2);color:var(--on-accent)}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none}

  .anchor{fill:var(--accent);stroke:var(--anchor-stroke);stroke-width:1.2;transition:r .15s var(--ease)}
  .anchor.dim{fill:var(--text3);opacity:.55}
  .anchor.small{fill:var(--blue)}
  .alabel{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;fill:var(--accent2);paint-order:stroke;stroke:var(--halo);stroke-width:2.6px;stroke-linejoin:round}
  .alabel.dim{fill:var(--text2);opacity:.75}
  .aform{font-family:'JetBrains Mono',monospace;font-size:7.5px;fill:var(--aform);paint-order:stroke;stroke:var(--halo);stroke-width:2.2px;stroke-linejoin:round}
  .dimtxt{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;fill:var(--dimtxt);paint-order:stroke;stroke:var(--halo);stroke-width:2.8px;stroke-linejoin:round}

  aside.info{width:304px;background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;flex-shrink:0}
  .sec{padding:16px 17px;border-bottom:1px solid var(--border)}
  .sec-title{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--text3);margin-bottom:12px;font-weight:600}

  .preset-row{display:flex;gap:6px;margin-bottom:12px}
  .preset{flex:1;padding:7px 0;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text2);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;transition:border-color .18s var(--ease),color .18s var(--ease),background .18s var(--ease)}
  .preset:hover{border-color:var(--accent);color:var(--accent)}
  .preset.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

  .fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .field{margin:0}
  .field label{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text2);margin-bottom:4px}
  .field label .ex{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--accent);opacity:.8}
  .field input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:6px 8px;font-family:'JetBrains Mono',monospace;font-size:12px;transition:border-color .18s var(--ease)}
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,158,11,.12)}

  .garment{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
  .garment-cap{font-size:11px;color:var(--text2);line-height:1.6;text-align:center;max-width:340px}

  .instr-head{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;margin-bottom:11px}
  .instr-list{margin:0;padding-left:17px}
  .instr-list li{font-size:12px;color:var(--text);line-height:1.6;margin-bottom:7px}
  .instr-list li::marker{color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px}
  .instr-sew{margin-top:12px;padding:10px 12px;border-radius:9px;background:var(--sew-bg);border:1px solid rgba(47,199,116,.28);font-size:11px;color:var(--text2);line-height:1.55}
  .instr-sew b{color:var(--green);font-weight:600;margin-right:4px}
  .instr-tip{margin-top:9px;padding:10px 12px;border-radius:9px;background:var(--accent-dim);border:1px solid rgba(245,158,11,.28);font-size:11px;color:var(--text2);line-height:1.55}
  .instr-tip b{color:var(--accent2);font-weight:600;margin-right:4px}
  /* read-aloud */
  .instr-titlebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .instr-titlebar .sec-title{margin-bottom:0}
  .listen-row{display:flex;align-items:center;gap:8px}
  .listen-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:9px;border:1px solid var(--accent);
    background:var(--accent-dim);color:var(--accent2);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;
    transition:background .18s var(--ease),color .18s var(--ease)}
  .listen-btn:hover{background:var(--accent);color:var(--on-accent)}
  .listen-btn.on{background:var(--accent);color:var(--on-accent)}
  .auto-read{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);cursor:pointer;user-select:none}
  .auto-read input{accent-color:var(--accent);width:14px;height:14px}
  .btn.listen-mini{padding:8px 11px;font-size:15px}
  .btn.listen-mini.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .instr-list li{transition:background .2s var(--ease)}
  .instr-list li.speaking{background:var(--accent-dim);border-radius:6px;box-shadow:0 0 0 4px var(--accent-dim)}
  .instr-sew.speaking,.instr-tip.speaking{box-shadow:0 0 0 2px var(--accent)}
  .instr-warn{margin-top:9px;padding:10px 12px;border-radius:9px;background:var(--warn-bg);border:1px solid rgba(240,82,74,.32);font-size:11px;color:var(--text2);line-height:1.55}

  @media (max-width:1100px) and (min-width:901px){
    aside.dag{width:230px}
    aside.info{width:230px}
  }

  /* ═══ PHONE / SMALL TABLET (≤900px) ════════════════════════════════════
     One scrolling column instead of three fixed panes:
       header (logo · names · language, garment switcher on its own row)
       → the draft (full width) → finished-garment preview
       → instructions → measurements → list of all steps (collapsible)
     Prev / Next sit in a bar fixed to the bottom of the screen, sized for a
     thumb. Swiping left/right on the draft also moves between steps.      */
  @media (max-width:900px){
    body{height:auto;min-height:100vh;min-height:100dvh;overflow-x:hidden;overflow-y:auto;
      padding-bottom:calc(68px + env(safe-area-inset-bottom))}
    header{height:auto;flex-wrap:wrap;padding:10px 12px 8px;gap:8px 10px;position:sticky;top:0;z-index:40;
      backdrop-filter:none;background:var(--surface)}
    .logo{font-size:14px}
    .tag{display:none}
    .switch{order:5;width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .switch::-webkit-scrollbar{display:none}
    .sw-btn{padding:9px 13px;font-size:13px;flex-shrink:0}
    .names-toggle{padding:6px 10px 6px 6px}
    .lang-toggle{height:36px}
    .lang-opt{padding:11px 12px;font-size:14px}
    .progress-rail{position:sticky;top:var(--hdr-h,96px);z-index:39}

    .app{flex-direction:column;overflow:visible}
    main{order:1;overflow:visible}
    aside.info{order:2;width:100%;border-left:none;border-top:1px solid var(--border);overflow:visible;
      display:flex;flex-direction:column}
    aside.info .sec-instr{order:1}
    aside.info .sec-measure{order:2}
    aside.dag{order:3;width:100%;border-right:none;border-top:1px solid var(--border);overflow:visible;padding:4px 0 10px}

    .stage-row{flex-direction:column;flex:none;overflow:visible}
    .canvas-wrap{flex:none;height:58vh;height:58svh;min-height:300px;padding:10px;background-size:18px 18px}
    .canvas-card{padding:8px;border-radius:14px}
    .preview-wrap{flex:none;height:34vh;height:34svh;min-height:220px;padding:12px 12px 14px;gap:8px;
      border-left:none;border-top:1px solid var(--border)}
    .preview-card{padding:10px;border-radius:12px}
    .garment-cap{font-size:12px;max-width:none;padding:0 6px}

    .controls{position:fixed;left:0;right:0;bottom:0;z-index:50;height:auto;
      padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:10px;
      box-shadow:0 -10px 28px rgba(0,0,0,.45)}
    .controls .dots{display:none}
    .controls .btn{height:46px;min-width:96px;justify-content:center;font-size:14px;border-radius:11px}
    .controls #prev-btn{order:1}
    .controls .step-readout{order:2;flex:1;text-align:center;font-size:11.5px;line-height:1.35}
    .controls #next-btn{order:4}

<script>
/* ═══════════════════════════════════════════════════════════════════
   SILAI DAG STUDIO — fully parametric.
   Fixed formulas & angles; the variables L,S,C,H,W,SL,B drive everything.
   Base-size presets (Small/Medium/Large) from the corpus measurement chart, or
   edit any field. Every point, curve, dimension and instruction recomputes.
   ═══════════════════════════════════════════════════════════════════ */
const ALL_FIELDS = [
  {id:'C', label:'Chest (C)',     ex:'C',  def:36},
  {id:'S', label:'Shoulder (S)',  ex:'S',  def:15},
  {id:'H', label:'Hip (H)',       ex:'H',  def:38},
  {id:'W', label:'Waist (W)',     ex:'W',  def:30},
  {id:'L', label:'Length (L)',    ex:'L',  def:38},
  {id:'FL',label:'Full length (FL)',ex:'FL',def:39},
  {id:'BL',label:'Belt length (BL)',ex:'BL',def:1.5},
  {id:'SL',label:'Sleeve len',    ex:'SL', def:7},
  {id:'Bm',label:'Armhole (B)',   ex:'B',  def:12},
  {id:'PL',label:'Pocket length (PL)',ex:'PL',def:13},
  {id:'Wd',label:'Waist drop',    ex:'A→G',def:15},
  {id:'N', label:'Neck (N)',      ex:'N',  def:17},
  {id:'CF',label:'Cuff depth (CF)',ex:'CF',def:2},
  {id:'CR',label:'Cuff round (CR)',ex:'CR',def:9.5},
  {id:'SK',label:'Skirt length (SK)',ex:'SK',def:28},
  {id:'HD',label:'Hip depth (HD)',ex:'HD',def:7},
  {id:'Fl',label:'Hem flare (Fl)',ex:'Fl',def:3},
];
const state = { part:'kurta_sleeve', m:{}, step:1, size:'large', namesMode:false, lang:'en' };

/* ═══ INSTRUCTION TRANSLATION ══════════════════════════════════════════
   Own dropdown UI (no Google banner, no cross-origin iframe to fight with).
   Tries Google's public translate endpoint first (no API key), falls back
   to MyMemory's free API if that fails, and only then gives up and shows
   English with a visible warning — it never fails silently. Results are
   cached per (lang,text) so re-visiting a step never re-fetches. */
const TCACHE = {};
let lastTranslateError = null;
async function tryGoogle(text, lang){
  const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${encodeURIComponent(lang)}&dt=t&q=${encodeURIComponent(text)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`google endpoint ${res.status}`);
  const data = await res.json();
  const out = (data[0]||[]).map(chunk=>chunk[0]).join('');
  if(!out) throw new Error('google endpoint returned empty result');
  return out;
}
async function tryMyMemory(text, lang){
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|${encodeURIComponent(lang)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`mymemory endpoint ${res.status}`);
  const data = await res.json();
  const out = data && data.responseData && data.responseData.translatedText;
  if(!out) throw new Error('mymemory endpoint returned empty result');
  return out;
}
async function translateText(text, lang){
  if(!text || lang==='en') return text;
  TCACHE[lang] = TCACHE[lang] || {};
  if(TCACHE[lang][text] !== undefined) return TCACHE[lang][text];
  try{
    const out = await tryGoogle(text, lang);
    TCACHE[lang][text] = out;
    lastTranslateError = null;
    return out;
  }catch(err1){
    console.warn('[SILAI translate] Google endpoint failed, trying MyMemory:', err1);
    try{
      const out = await tryMyMemory(text, lang);
      TCACHE[lang][text] = out;
      lastTranslateError = null;
      return out;
    }catch(err2){
      console.error('[SILAI translate] both translation providers failed:', err2);
      lastTranslateError = (location.protocol==='file:')
        ? 'Translation needs this page served over http(s) — opening it as a local file (file://) blocks the network request in most browsers. Try running a tiny local server (e.g. "npx serve" in this folder) and opening it from http://localhost instead, or host it anywhere and open it from a URL.'
        : `Both translation services are unreachable right now (${err2.message}). Showing English instead.`;
      return text;
    }
  }
}

const fmt = (x)=>{ const r = Math.round(x*100)/100; return (r%1===0? r.toFixed(0) : String(r)); };
// derived values — the single source of truth for formulas
function V(m){ return {
  L:m.L, S:m.S, C:m.C, H:m.H, W:m.W, SL:m.SL, B:m.Bm, Wd:m.Wd,
  width:m.H/4+1, tira:m.S/2, chestStart:m.C/4-1, chestWidth:m.C/4+1, waist:m.W/4+1,
  hipDrop:7, neckDepth:m.C/6, neckWidth:m.C/12, backNeck:4, shoulderSlope:m.C/36-0.2,
  bicep:m.C/4-0.5, cap:m.C/12, mori:m.Bm/2,
  FL:m.FL, BL:m.BL, PL:m.PL,
  tLen:m.FL-m.BL, tHipPt:m.H/3-1, tHipF:m.H/4+2, tHipB:m.H/4+2+m.H/16,
  tWaistF:m.W/4+0.5, tWaistB:m.W/4+1.5, tBelt1:m.W/2+1, tBelt2:m.W/2+2.5,
  tFly:m.H/6+2, tMori:m.Bm/4, tKneeAdd:m.H/36, tShape:m.H/12, tDart:m.H/6-1,
  bNeckWidth:m.C/12+0.5, bShoulderSlope:m.C/36-0.3, bWaist:m.W/4+1.25, bBackNeck:m.C/8, mainDart:m.C/4+1, thirdDart:m.C/8,
};}


function dimH(x1,x2,y,label){const t=3;
  return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="var(--text3)" stroke-width=".8"/>`
   +`<line x1="${x1}" y1="${y-t}" x2="${x1}" y2="${y+t}" stroke="var(--text3)" stroke-width=".8"/>`
   +`<line x1="${x2}" y1="${y-t}" x2="${x2}" y2="${y+t}" stroke="var(--text3)" stroke-width=".8"/>`
   +`<text class="dimtxt" x="${(x1+x2)/2}" y="${y-3}" text-anchor="middle">${label}</text>`;}
function dimV(x,y1,y2,label){const t=3;
  return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="var(--text3)" stroke-width=".8"/>`
   +`<line x1="${x-t}" y1="${y1}" x2="${x+t}" y2="${y1}" stroke="var(--text3)" stroke-width=".8"/>`
   +`<line x1="${x-t}" y1="${y2}" x2="${x+t}" y2="${y2}" stroke="var(--text3)" stroke-width=".8"/>`
   +`<text class="dimtxt" x="${x+4}" y="${(y1+y2)/2}" transform="rotate(-90 ${x+4} ${(y1+y2)/2})" text-anchor="middle">${label}</text>`;}
// Catmull-Rom spline through points → smooth French-curve path (for the sleeve cap)
function crPath(pts,g0,g1){
  if(pts.length<2) return '';
  let d = `M ${pts[0].x.toFixed(2)} ${pts[0].y.toFixed(2)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||g0||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||g1||pts[i+1];
    const c1={x:p1.x+(p2.x-p0.x)/6, y:p1.y+(p2.y-p0.y)/6};
    const c2={x:p2.x-(p3.x-p1.x)/6, y:p2.y-(p3.y-p1.y)/6};
    d += ` C ${c1.x.toFixed(2)} ${c1.y.toFixed(2)} ${c2.x.toFixed(2)} ${c2.y.toFixed(2)} ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
  }
  return d;
}

// per-point label placement — direction → offset + anchor (avoids collisions)
const LAB = {
  r:{dx:7,dy:-2,a:'start'}, l:{dx:-7,dy:-2,a:'end'},
  u:{dx:0,dy:-8,a:'middle'}, d:{dx:0,dy:15,a:'middle'},
  ur:{dx:5,dy:-6,a:'start'}, ul:{dx:-5,dy:-6,a:'end'},
  dr:{dx:5,dy:14,a:'start'}, dl:{dx:-5,dy:14,a:'end'},
};


/* ═══ SILAI OBJECT STORE CLIENT ═════════════════════════════════════════
   Every drafting program is an Executable Craft Object (ECO) kept in the
   object store under eco/. eco/manifest.json lists each object with its
   kind (library, component or garment), file, dependencies, SHA-256 and
   provenance. require(id) retrieves an object, checks its hash against the
   manifest, runs it, resolves its dependencies the same way, and registers
   garments in PARTS and CHARTS. Nothing is drafted until its ECO has been
   retrieved, so a garment can be added or corrected by publishing a new
   object and manifest entry, without touching this file. */
const PARTS = {};
const CHARTS = {};
const SILAI = window.SILAI = (function(){
  const STORE = new URL('eco/', window.location.href);
  const factories = {}, modules = {}, pending = {};
  let manifest = null, manifestPromise = null;
  modules.kit = { fmt, V, dimH, dimV, crPath, LAB };   // built into the studio core
  function define(id, deps, factory){ factories[id] = { deps, factory }; }
  async function sha256(text){
    if(!(window.crypto && crypto.subtle)) return null;   // insecure context: skip the check
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  function loadManifest(){
    if(!manifestPromise) manifestPromise = fetch(new URL('manifest.json', STORE), {cache:'no-cache'})
      .then(r=>{ if(!r.ok) throw new Error('SILAI object store: manifest '+r.status); return r.json(); })
      .then(j=>{ manifest = j; return j; });
    return manifestPromise;
  }
  function entry(id){ return manifest && manifest.objects.find(o=>o.id===id); }
  async function retrieve(o){
    const url = new URL(o.file, STORE);
    if(manifest.version) url.searchParams.set('v', o.sha256 ? o.sha256.slice(0,12) : manifest.version);
    const r = await fetch(url);
    if(!r.ok) throw new Error(`SILAI object store: ${o.id} ${r.status}`);
    const text = await r.text();
    const h = await sha256(text);
    if(h && o.sha256 && h !== o.sha256) throw new Error(`SILAI object store: ${o.id} failed its integrity check`);
    return text;
  }
  function run(o, text){
    const s = document.createElement('script');
    s.textContent = text + `\n//# sourceURL=${new URL(o.file, STORE).pathname}`;
    document.head.appendChild(s);
    s.remove();
    if(!factories[o.id]) throw new Error(`SILAI object store: ${o.id} did not define itself`);
  }
  function require(id){
    if(modules[id]) return Promise.resolve(modules[id]);
    if(!pending[id]) pending[id] = (async()=>{
      await loadManifest();
      const o = entry(id);
      if(!o) throw new Error(`SILAI object store: no object '${id}'`);
      if(!factories[id]) run(o, await retrieve(o));
      const f = factories[id];
      const deps = await Promise.all(f.deps.map(require));
      const mod = f.factory(...deps);
      if(o.kind === 'garment'){
        PARTS[id] = mod;
        CHARTS[mod.chart] = mod.chartSizes;
      }
      modules[id] = mod;
      return mod;
    })();
    return pending[id];
  }
  function garments(){ return manifest ? manifest.objects.filter(o=>o.kind==='garment') : []; }
  function lookup(text){                     // which garment ECO matches a description
    const t = String(text||'').toLowerCase();
    let best = null, bestLen = 0;
    garments().forEach(o=>(o.match||[]).forEach(k=>{
      if(t.includes(k) && k.length > bestLen){ best = o.id; bestLen = k.length; }
    }));
    return best;
  }
  return { define, require, loadManifest, garments, lookup, get manifest(){ return manifest; } };
})();

/* ═══ ORIGINAL-NAME MODE ══════════════════════════════════════════════
   Every drafted point already carries a corpus-accurate `note` (e.g.
   'chest·fold', 'shoulder tip'). Instead of hand-writing a second copy of
   every instruction, we derive a human name from that same note and
   substitute it into the instruction prose wherever a point letter is
   referenced in an unambiguous pattern (after "point/mark/Join/From/at/to",
   inside parentheses, or either side of a "→"/"–"). Bare letters used mid
   -sentence in a way we can't safely disambiguate from ordinary English are
   left as-is — this keeps the substitution 100% safe against misfires like
   turning the word "A" (article) or "I" (pronoun) into a garment point. */
function nameForNote(note){
  if(!note) return null;
  const parts = note.split('·').map(s=>s.trim()).filter(Boolean);
  if(!parts.length) return null;
  let main = parts[0], qual = parts[1];
  if(/^(ref|box)$/i.test(main)) return null;
  main = main.replace(/\bctr\b/gi,'center');
  const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
  const noun = /point|apex|corner|tip|seam|curve|dart|line|width|depth/i;
  let base = noun.test(main) ? cap(main) : `${cap(main)} point`;
  if(qual) base += /side/i.test(qual) ? ` (${qual})` : ` (${qual} side)`;
  return base;
}
function buildNames(ph, pt){
  const names={};
  Object.entries(ph.letters||{}).forEach(([key,disp])=>{
    const p = pt[key]; if(!p) return;
    const nm = nameForNote(p.note);
    if(nm) names[disp]=nm;
  });
  return names;
}
function humanize(text, names){
  if(!text || !names || !Object.keys(names).length) return text;
  const tok = '([A-Z]{1,2}[0-9]?)';
  const decap = s => s.charAt(0).toLowerCase()+s.slice(1);
  let out = text;
  // "chest point F" / "the waist point H" — the landmark noun already duplicates
  // the name we're about to substitute, so swallow noun+point together first.
  out = out.replace(new RegExp(`\\b(chest|waist|hip|shoulder|neck|hem|underarm|fold|side|back|front)\\s+point\\s*\\(?${tok}\\)?`,'gi'),
    (m,noun,a)=> names[a] ? decap(names[a]) : m);
  out = out.replace(new RegExp(`\\bJoin ${tok}[–-]${tok}\\b`,'g'), (m,a,b)=> (names[a]&&names[b]) ? `Join the ${names[a]} to the ${names[b]}` : m);
  out = out.replace(new RegExp(`\\bmark point ${tok}\\b`,'g'), (m,a)=> names[a] ? `mark the ${names[a]}` : m);
  out = out.replace(new RegExp(`\\bpoint ${tok}\\b`,'g'), (m,a)=> names[a] ? `the ${names[a]}` : m);
  out = out.replace(new RegExp(`\\bmark ${tok}\\b`,'g'), (m,a)=> names[a] ? `mark the ${names[a]}` : m);
  out = out.replace(new RegExp(`\\bFrom ${tok},`,'g'), (m,a)=> names[a] ? `From the ${names[a]},` : m);
  out = out.replace(new RegExp(`${tok}→${tok}`,'g'), (m,a,b)=> (names[a]&&names[b]) ? `${names[a]} → ${names[b]}` : m);
  out = out.replace(new RegExp(`\\b${tok}–${tok}\\b`,'g'), (m,a,b)=> (names[a]&&names[b]) ? `${names[a]}–${names[b]}` : m);
  out = out.replace(new RegExp(`\\b(at|to|toward|near) ${tok}\\b`,'g'), (m,w,a)=> names[a] ? `${w} the ${names[a]}` : m);
  out = out.replace(new RegExp(`\\(${tok}\\)`,'g'), (m,a)=> names[a] ? `(${names[a]})` : m);
  return out;
}



function totalSteps(part){ return part.phases.reduce((a,p)=>a+p.steps.length,0); }
function resolve(part, gstep){ let acc=0;
  for(let i=0;i<part.phases.length;i++){ const p=part.phases[i];
    if(gstep<=acc+p.steps.length) return {phase:p, pIdx:i, local:gstep-acc};
    acc+=p.steps.length;
  }
  const last=part.phases[part.phases.length-1];
  return {phase:last, pIdx:part.phases.length-1, local:last.steps.length};
}

/* ═══ RENDER ══════════════════════════════════════════════════════════ */
const stage = document.getElementById('stage');
const isPhone = ()=>window.matchMedia('(max-width:900px)').matches;
function fitBox(card, wrap, w, h, capScale){
  const pad = isPhone() ? 22 : 52;
  const availW = Math.max(120, wrap.clientWidth - pad);
  const availH = Math.max(120, wrap.clientHeight - pad);
  const scale = Math.min(availW/w, availH/h, capScale||1.6);
  card.style.width = Math.round(w*scale)+'px';
  card.style.height = Math.round(h*scale)+'px';
}
function fitCard(w,h){
  fitBox(document.getElementById('canvas-card'), document.querySelector('.canvas-wrap'), w, h, 1.6);
}
let lastWH = {w:400,h:600};
window.addEventListener('resize', ()=>{
  fitCard(lastWH.w, lastWH.h);
  if(lastPreviewWH) fitBox(document.getElementById('preview-card'), document.querySelector('.preview-wrap'), lastPreviewWH.w, lastPreviewWH.h, 3.2);
});

function render(){
  if(!PARTS[state.part]) return;
  const part=PARTS[state.part], m=state.m, gstep=state.step;
  const {phase:ph, pIdx, local:cur} = resolve(part, gstep);
  const pt=ph.points(m), edges=ph.edges(pt,m);
  const {W:SW,H:SH}=ph.sheet(m), SCALE=ph.scale, PAD=ph.pad;
  const w=SW*SCALE+PAD*2+ph.mr, h=SH*SCALE+PAD*2+ph.mb;
  lastWH = {w,h};
  fitCard(w,h);
  stage.setAttribute('viewBox',`0 0 ${w} ${h}`);
  stage.setAttribute('preserveAspectRatio','xMidYMid meet');
  const sx=x=>x*SCALE+PAD, sy=y=>y*SCALE+PAD;

  let g=`<defs><pattern id="grid" width="${SCALE}" height="${SCALE}" patternUnits="userSpaceOnUse">
      <path d="M ${SCALE} 0 L 0 0 0 ${SCALE}" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern></defs>
    <rect width="${w}" height="${h}" fill="var(--paper)"/>
    <rect x="${sx(0)}" y="${sy(0)}" width="${SW*SCALE}" height="${SH*SCALE}" fill="url(#grid)" opacity=".85"/>
    <rect x="${sx(0)}" y="${sy(0)}" width="${SW*SCALE}" height="${SH*SCALE}" fill="var(--sheet-fill)" stroke="var(--sheet-stroke)" stroke-width="1.4"/>`;
  if(ph.fold!==false) g+=`<text class="dimtxt" x="${sx(SW)+ph.foldDx}" y="${sy(SH/2)}" transform="rotate(-90 ${sx(SW)+ph.foldDx} ${sy(SH/2)})" fill="var(--purple)">${ph.foldLabel||'on fold'}</text>`;

  edges.forEach(e=>{ if(e.s>cur) return;
    const isNew=e.s===cur, dim=!isNew;
    const dd=e.d.replace(/(-?\d+\.?\d*) (-?\d+\.?\d*)/g,(_,a,b)=>`${sx(+a)} ${sy(+b)}`);
    g+=`<path id="${e.id}" data-phase="${pIdx+1}" data-step="${e.s}" data-from="${e.from}" data-to="${e.to}" data-formula="${e.gov}"${e.man?' data-manual="true"':''} `
      +`d="${dd}" fill="none" stroke="${e.color}" stroke-width="${isNew?2.8:1.6}" `
      +(e.dash?`stroke-dasharray="4,3" `:'')
      +`stroke-linecap="round" stroke-linejoin="round" opacity="${dim?0.4:1}"${isNew?' filter="drop-shadow(0 0 3px '+e.color+')"':''}/>`;
  });

  Object.entries(pt).forEach(([k,p])=>{ if(k[0]==='_'||p.s>cur) return;
    const isNew=p.s===cur, small=ph.small[k];
    const onFold=Math.abs(p.x-SW)<0.01;
    const dir=(ph.labs&&ph.labs[k]) || (onFold?'r':'l');
    const o=LAB[dir]||LAB.l; const px=sx(p.x), py=sy(p.y);
    const r=isNew?(small?3:4.2):(small?2.2:2.8);
    const govDy = o.dy<0 ? o.dy-9 : o.dy+9;
    g+=`<circle class="anchor${small?' small':''}${isNew?'':' dim'}" cx="${px}" cy="${py}" r="${r}"/>`;
    g+=`<text class="alabel${isNew?'':' dim'}" x="${px+o.dx}" y="${py+o.dy}" text-anchor="${o.a}">${ph.letters[k]||k}</text>`;
    if(isNew&&p.note&&!small) g+=`<text class="aform" x="${px+o.dx}" y="${py+govDy}" text-anchor="${o.a}">${p.gov}</text>`;
  });

  g += ph.dims(pt,m,cur,sx,sy,SW,SH);
  stage.innerHTML=g;

  renderDag(part); renderDots(part); renderGarment(part); renderInstructions(part);
  document.getElementById('garment-title').textContent=part.garmentTitle;
  document.getElementById('readout').innerHTML=`<span class="ro-name">${ph.name}</span><span class="ro-sep"> · </span><b>${cur}</b>/${ph.steps.length}`;
  document.getElementById('prev-btn').disabled=gstep===1;
  document.getElementById('next-btn').disabled=gstep===totalSteps(part);
  document.getElementById('tag').textContent=part.tag;
  const pct = Math.round((gstep/totalSteps(part))*100);
  document.getElementById('progress-fill').style.width = pct+'%';
  ['stage','instr','garment'].forEach(id=>{
    const el=document.getElementById(id); if(!el) return;
    el.classList.remove('step-in'); void el.offsetWidth; el.classList.add('step-in');
  });
}

function renderDag(part){
  const host=document.getElementById('dag-nodes'); host.innerHTML='';
  const multi=part.phases.length>1; let gi=0;
  part.phases.forEach((ph,pi)=>{
    if(multi){ const hd=document.createElement('div'); hd.className='phase-hdr';
      hd.innerHTML=`<span>${ph.name}</span><span class="pl"></span>`; host.appendChild(hd); }
    ph.steps.forEach((st,si)=>{ gi++; const g=gi;
      const n=document.createElement('div');
      n.className='node '+(g===state.step?'active':g<state.step?'done':'locked')+(si===0?' first':'');
      const deps=st.deps.map(d=>`<span class="chip dep">${d}</span>`).join('');
      const ct=(ph.cross!==undefined)?ph.cross:'needs Part 1 armhole';
      const cross=(pi>0&&si===0&&ct)?`<span class="chip cross">${ct}</span>`:'';
      n.innerHTML=`<div class="num">${st.n}</div>`+(st.man?`<div class="badge-man">✎</div>`:'')
        +`<div class="hi">${st.en}</div><div class="formula">${st.formula}</div>`
        +`<div class="chips">${st.deps.length?`<span class="chip">needs</span>${deps}`:'<span class="chip">root</span>'}${cross}${st.man?'<span class="chip man">manual</span>':''}</div>`;
      n.onclick=(gg=>()=>{state.step=gg;render();})(g);
      host.appendChild(n);
    });
  });
}
function renderDots(part){
  const host=document.getElementById('dots'); host.innerHTML=''; let gi=0;
  part.phases.forEach((ph,pi)=>{ ph.steps.forEach((st,si)=>{ gi++; const g=gi;
    const d=document.createElement('div');
    d.className='dot '+(g===state.step?'on':g<state.step?'done':'')+(pi>0&&si===0?' sep':'');
    d.onclick=(gg=>()=>{state.step=gg;render();})(g); host.appendChild(d);
  }); });
}
/* USHA manual convention: the whole garment is always drawn plain, and only the
   step's own line is inked in — over ONE side of it (the left). So the silhouette
   is never cut; the highlight is what gets clipped to the half. */
const CENTRE_IDS = { length:1, rise:1, riseB:1 };  // ids that ARE the centre line itself
const SECOND_CURVE = { backneck:1, riseB:1, dart:1, skbdart:1 };  // drawn dashed — the far face of the garment
const WHOLE_IDS = { belt1:1, belt2:1, band:1 };     // separate pieces — not a folded half
// rough bbox of an SVG path from its coordinate pairs (control points give margin)
function pathBox(d){ const n=(d.match(/-?\d*\.?\d+/g)||[]).map(Number); let b=null;
  for(let i=0;i+1<n.length;i+=2){ const x=n[i],y=n[i+1];
    b = b ? {x0:Math.min(b.x0,x),y0:Math.min(b.y0,y),x1:Math.max(b.x1,x),y1:Math.max(b.y1,y)} : {x0:x,y0:y,x1:x,y1:y}; }
  return b||{x0:0,y0:0,x1:140,y1:200}; }
let lastPreviewWH = {w:140,h:200};
function renderGarment(part){ const st=part.garment.HL[state.step]||{ids:[],cap:''};
  const gm = part.garment.gen ? part.garment.gen(state.m) : {base:part.garment.base, hl:part.garment.hl};
  const cx=70, fold = gm.fold || part.garment.fold || {y1:30,y2:184};
  const bb=pathBox(gm.base);                                  // hug the drawing
  const left=Math.max(0,Math.round(bb.x0-5)), right=Math.min(140,Math.round(bb.x1+5));
  const top =Math.max(0,Math.round(Math.min(bb.y0,fold.y1)-6));
  const bot =Math.round(Math.max(bb.y1,fold.y2)+6);
  const VW=right-left, VH=bot-top;
  lastPreviewWH = {w:VW,h:VH};
  fitBox(document.getElementById('preview-card'), document.querySelector('.preview-wrap'), VW, VH, 3.2);
  let s=`<svg viewBox="${left} ${top} ${VW} ${VH}" style="width:100%;height:100%;display:block">`;
  // Which half of the preview was actually drafted? The kurti and blouse sheets
  // put the fold on the right, so the drafted half is the left one. The trouser
  // sheets are the other way round — the fork/centre edge is on the LEFT of the
  // draft and the side seam on the right — so the matching half of the finished
  // garment is the right leg. Clip to whichever half the phase drew.
  const hx = part.garment.half==='right' ? cx : left,
        hw = part.garment.half==='right' ? right-cx : cx-left;
  s+=`<defs><clipPath id="halfclip"><rect x="${hx}" y="${top}" width="${hw}" height="${VH}"/></clipPath></defs>`;
  // the garment, drawn whole and plain — never cut
  s+=`<path d="${gm.base}" fill="var(--gm-fill)" stroke="var(--gm-line)" stroke-width="1.4" stroke-linejoin="round"/>`;
  // interior construction lines — always drawn plain, as the manual's thumbnails do
  if(gm.plain) s+=`<path d="${gm.plain}" fill="none" stroke="var(--gm-line)" stroke-width="0.9" stroke-linecap="round" opacity="0.8"/>`;
  // faint centre line (the fold), part of the plain drawing
  s+=`<line x1="${cx}" y1="${fold.y1}" x2="${cx}" y2="${fold.y2}" stroke="var(--gm-line)" stroke-width="1" stroke-dasharray="4,3"/>`;
  // the step's own line, inked over the left half only
  const ink=(d,col,dash)=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.6" `
    +`stroke-linecap="round"${dash} filter="drop-shadow(0 0 3px ${col})"/>`;
  let half='', whole='';
  st.ids.forEach(id=>{ const d=gm.hl[id]; if(!d) return;
    const dash = SECOND_CURVE[id]?' stroke-dasharray="4,3"':'';
    if(CENTRE_IDS[id]){ whole+=ink(d,'var(--purple)',dash); return; } // sits on the centre line
    if(WHOLE_IDS[id]){ whole+=ink(d,'var(--red)',dash); return; }    // a whole separate piece
    half+=ink(d,'var(--red)',dash);
  });
  if(half)  s+=`<g clip-path="url(#halfclip)">${half}</g>`;
  if(whole) s+=whole;
  s+=`</svg>`;
  document.getElementById('garment').innerHTML=s;
  document.getElementById('garment-cap').textContent=st.cap;
}
function renderInstructions(part){
  const {phase:ph, local:cur}=resolve(part, state.step);
  const v=V(state.m);
  const set=ph.instr||{}; const step=set[cur]||{};
  let draft=(step.draft?step.draft(v,state.m):[]);
  let sew=(step.sew?step.sew(v,state.m):null);
  let tip=(step.tip?step.tip(v,state.m):null);
  if(state.namesMode){
    const pt = ph.points(state.m);
    const names = buildNames(ph, pt);
    draft = draft.map(d=>humanize(d,names));
    if(sew) sew = humanize(sew,names);
    if(tip) tip = humanize(tip,names);
  }
  const head = `${ph.name} · step ${cur} / ${ph.steps.length}`;
  const paint = (d,s,t,h,lg,ls,lt)=>{
    let html=`<div class="instr-head">${h}</div>`;
    html+='<ol class="instr-list">'+d.map(x=>`<li>${x}</li>`).join('')+'</ol>';
    if(s) html+=`<div class="instr-sew"><b>✂ ${ls||'Stitch'}</b> <span class="say">${s}</span></div>`;
    if(t) html+=`<div class="instr-tip"><b>💡 ${lt||'Tip'}</b> <span class="say">${t}</span></div>`;
    const host=document.getElementById('instr');
    host.innerHTML=html;
    // what the read-aloud button will say: each numbered line, then the
    // stitch note and the tip — in the language that is on screen
    const items=[];
    host.querySelectorAll('.instr-list li').forEach(el=>items.push({el, text:el.textContent}));
    host.querySelectorAll('.instr-sew,.instr-tip').forEach(el=>items.push({el, text:el.querySelector('.say').textContent}));
    painted={lang:lg, items};
  };
  stopSpeaking();
  paint(draft, sew, tip, head, 'en');
  if(state.lang!=='en'){
    const myStep=state.step, myPart=state.part, myLang=state.lang;
    document.getElementById('instr').classList.add('lang-loading');
    instrReady = Promise.all([
      Promise.all(draft.map(d=>translateText(d,myLang))),
      sew ? translateText(sew,myLang) : Promise.resolve(null),
      tip ? translateText(tip,myLang) : Promise.resolve(null),
      translateText(head,myLang),
      translateText('Stitch',myLang),
      translateText('Tip',myLang),
    ]).then(([d2,s2,t2,h2,ls,lt])=>{
      if(state.step!==myStep || state.part!==myPart || state.lang!==myLang) return; // stale — user moved on
      paint(d2,s2,t2,h2,lastTranslateError?'en':myLang,ls,lt);
      if(lastTranslateError){
        document.getElementById('instr').insertAdjacentHTML('beforeend',
          `<div class="instr-warn">⚠ ${lastTranslateError}</div>`);
      }
    }).finally(()=>{ document.getElementById('instr').classList.remove('lang-loading'); });
  } else {
    instrReady = Promise.resolve();
  }
  if(TTS.auto) startSpeaking();
}

/* ═══ READ ALOUD ══════════════════════════════════════════════════════
   Reads the instructions on screen, in whatever language they are shown in.
   1. The phone's own voices (Web Speech API) when one exists for that
      language — works offline, and Android ships Indian-language voices.
   2. Otherwise Google's public voice endpoint (the same free service the
      translation already uses), one short sentence at a time.
   3. If neither can speak the language, say so on screen — never fail silently.
   The line being read is highlighted, as in the narrated videos.          */
let painted = {lang:'en', items:[]};
let instrReady = Promise.resolve();
const TTS = { token:0, auto:false, audio:null, speaking:false };
const INCH = { en:'inches', hi:'इंच', mr:'इंच', bn:'ইঞ্চি', as:'ইঞ্চি', ta:'அங்குலம்', te:'అంగుళాలు', gu:'ઇંચ',
  kn:'ಇಂಚು', ml:'ഇഞ്ച്', pa:'ਇੰਚ', ur:'انچ', or:'ଇଞ୍ଚ', es:'pulgadas', fr:'pouces', pt:'polegadas',
  ar:'بوصة', sw:'inchi', id:'inci', 'zh-CN':'英寸' };
function speakable(text, lang){
  const inch = INCH[lang] || INCH[lang.split('-')[0]] || 'inches';
  return text
    .replace(/(\d)\s*[″"]/g, `$1 ${inch}`)        // 15″ → 15 inches (in the reader's language)
    .replace(/[→↓↑←]/g, ', ')
    .replace(/[·•]/g, ', ')
    .replace(/−/g, ' - ')
    .replace(/\s+/g, ' ').trim();
}
// short pieces: some voices stop after ~15 s, and the web endpoint takes ≤200 chars
function chunks(text){
  const out=[]; let cur='';
  // split after sentence ends (no look-behind: older iPhones can't parse it)
  text.replace(/([.!?।॥;:。])\s+/g,'$1\u0001').split('\u0001').forEach(part=>{
    while(part.length>180){ const cut=part.lastIndexOf(' ',180)>40?part.lastIndexOf(' ',180):180;
      if(cur){ out.push(cur); cur=''; } out.push(part.slice(0,cut)); part=part.slice(cut).trim(); }
    if((cur+' '+part).trim().length>180){ if(cur) out.push(cur); cur=part; }
    else cur=(cur+' '+part).trim();
  });
  if(cur) out.push(cur);
  return out.filter(Boolean);
}
function voicesReady(){
  return new Promise(res=>{
    if(!('speechSynthesis' in window)) return res([]);
    const v=speechSynthesis.getVoices(); if(v.length) return res(v);
    const t=setTimeout(()=>res(speechSynthesis.getVoices()),1500);
    speechSynthesis.addEventListener('voiceschanged',()=>{ clearTimeout(t); res(speechSynthesis.getVoices()); },{once:true});
  });
}
async function pickVoice(lang){
  const vs=await voicesReady(); if(!vs.length) return null;
  const want=lang.toLowerCase(), base=want.split('-')[0];
  const norm=v=>(v.lang||'').toLowerCase().replace('_','-');
  const c=vs.filter(v=>norm(v)===want || norm(v).split('-')[0]===base);
  if(!c.length) return null;
  return c.find(v=>/-in$/.test(norm(v)) && v.localService) || c.find(v=>/-in$/.test(norm(v)))
      || c.find(v=>v.localService) || c[0];
}
function sayDevice(text, voice, my){
  return new Promise(res=>{
    const u=new SpeechSynthesisUtterance(text);
    u.voice=voice; u.lang=voice.lang; u.rate=0.92;
    u.onend=()=>res(true);
    u.onerror=e=>res(TTS.token!==my || e.error==='interrupted' || e.error==='canceled');
    speechSynthesis.speak(u);
  });
}
function sayWeb(text, lang, my){
  return new Promise(res=>{
    const a=new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${encodeURIComponent(lang)}&q=${encodeURIComponent(text)}`);
    TTS.audio=a;
    a.onended=()=>res(true);
    a.onerror=()=>res(TTS.token!==my);
    a.play().catch(()=>res(TTS.token!==my));
  });
}
function langName(code){
  const o=[...document.querySelectorAll('.lang-opt')].find(x=>x.dataset.lang===code);
  return o ? o.textContent.trim() : code;
}
function setListenUI(on){
  TTS.speaking=on;
  document.getElementById('listen-btn').classList.toggle('on',on);
  document.getElementById('listen-mini').classList.toggle('on',on);
  document.getElementById('listen-mini').textContent = on ? '■' : '🔊';
  const lab=document.getElementById('listen-label');
  lab.dataset.i18n = on ? 'Stop' : 'Listen';
  lab.textContent = chromeText(lab.dataset.i18n);
}
function unmark(){ document.querySelectorAll('#instr .speaking').forEach(e=>e.classList.remove('speaking')); }
function stopSpeaking(){
  TTS.token++;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  if(TTS.audio){ TTS.audio.pause(); TTS.audio=null; }
  unmark();
  if(TTS.speaking) setListenUI(false);
}
async function startSpeaking(){
  stopSpeaking();
  const my=TTS.token;
  setListenUI(true);
  await instrReady;                       // wait for the translated text
  if(my!==TTS.token) return;
  const {lang, items}=painted;
  const voice=await pickVoice(lang);
  if(my!==TTS.token) return;
  let failed=false;
  for(const it of items){
    if(my!==TTS.token) return;
    unmark(); it.el.classList.add('speaking');
    if(!isPhone()) it.el.scrollIntoView({block:'nearest',behavior:'smooth'});
    for(const piece of chunks(speakable(it.text, lang))){
      if(my!==TTS.token) return;
      const ok = voice ? await sayDevice(piece, voice, my) : await sayWeb(piece, lang, my);
      if(!ok){ failed=true; break; }
    }
    if(failed) break;
  }
  if(my!==TTS.token) return;
  unmark(); setListenUI(false);
  if(failed){
    document.getElementById('instr').insertAdjacentHTML('beforeend',
      `<div class="instr-warn">🔇 ${chromeText('No voice was found for')} ${langName(lang)}. `
      +`${chromeText('Install that language voice in the phone settings (Text-to-speech), or check the internet connection.')}</div>`);
  }
}
function toggleSpeaking(){ if(TTS.speaking) stopSpeaking(); else startSpeaking(); }
document.getElementById('listen-btn').addEventListener('click', toggleSpeaking);
document.getElementById('listen-mini').addEventListener('click', toggleSpeaking);
document.getElementById('auto-read').addEventListener('change', e=>{
  TTS.auto=e.target.checked;
  if(TTS.auto) startSpeaking(); else stopSpeaking();
});

/* ═══ CONTROLS IN THE CHOSEN LANGUAGE ═════════════════════════════════
   Buttons and section titles marked data-i18n are translated with the same
   service as the instructions, so a tailor reading Tamil sees Tamil
   buttons too. English text stays in data-i18n; the shown text changes. */
const CHROME = {};
function chromeText(en){ return (state.lang!=='en' && CHROME[state.lang] && CHROME[state.lang][en]) || en; }
async function translateChrome(){
  const lang=state.lang;
  const els=[...document.querySelectorAll('[data-i18n]')];
  const extra=['Listen','Stop','No voice was found for',
    'Install that language voice in the phone settings (Text-to-speech), or check the internet connection.'];
  if(lang==='en'){ els.forEach(el=>el.textContent=el.dataset.i18n); return; }
  CHROME[lang]=CHROME[lang]||{};
  const keys=[...new Set(els.map(el=>el.dataset.i18n).concat(extra))];
  await Promise.all(keys.map(async k=>{ CHROME[lang][k]=await translateText(k,lang); }));
  if(state.lang!==lang) return;
  els.forEach(el=>{ el.textContent=chromeText(el.dataset.i18n); });
}
function renderFields(){
  const part=PARTS[state.part];
  if(!part) return;
  const host=document.getElementById('measure');
  const presets=['small','medium','large'].map(k=>
    `<button class="preset${state.size===k?' active':''}" data-size="${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('');
  const ov=part.fieldLabels||{};
  const fields=ALL_FIELDS.filter(f=>part.uses.includes(f.id)).map(f=>
    `<div class="field"><label>${ov[f.id]||f.label}<span class="ex">${f.ex}</span></label>
     <input type="number" step="0.5" data-id="${f.id}" value="${state.m[f.id]}"/></div>`).join('');
  host.innerHTML=`<div class="preset-row">${presets}</div><div class="fields-grid">${fields}</div>`;
  host.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{
    const k=b.dataset.size; state.size=k; state.m={...CHARTS[part.chart][k]}; renderFields(); render();
  });
  host.querySelectorAll('input[data-id]').forEach(inp=>inp.addEventListener('input',e=>{
    state.m[e.target.dataset.id]=parseFloat(e.target.value)||0;
    if(state.size!=='custom'){ state.size='custom'; host.querySelectorAll('.preset').forEach(b=>b.classList.remove('active')); }
    render();
  }));
}

document.getElementById('switch').addEventListener('click',async e=>{
  const b=e.target.closest('.sw-btn'); if(!b) return;
  try{ await SILAI.require(b.dataset.part); }
  catch(err){ showStoreError(err); return; }
  document.querySelectorAll('.sw-btn').forEach(x=>x.classList.toggle('active',x===b));
  state.part=b.dataset.part; state.step=1;
  state.m={...CHARTS[PARTS[state.part].chart].large}; state.size='large';
  document.getElementById('dag-title').textContent = PARTS[state.part].label+' — DAG';
  renderFields(); render();
  if(isPhone()) window.scrollTo({top:0});
});
// Escape the header's stacking context entirely (backdrop-filter on an ancestor
// silently turns position:fixed descendants into something scoped to that
// ancestor, so z-index stops working against later page content) by moving
// the menu to be a direct child of <body> once, up front.
document.body.appendChild(document.getElementById('lang-menu'));

function positionLangMenu(){
  const menu = document.getElementById('lang-menu');
  const sidebar = document.querySelector('aside.info');
  const btn = document.getElementById('lang-toggle');
  const sb = sidebar.getBoundingClientRect(), bb = btn.getBoundingClientRect();
  if(isPhone()){                       // sidebar is below the fold on phones
    menu.style.left = '8px';
    menu.style.width = (window.innerWidth-16)+'px';
  } else {
  // full-width match to the sidebar it sits above, so nothing behind it can peek out
  menu.style.left = sb.left+'px';
  menu.style.width = sb.width+'px';
  }
  menu.style.top = (bb.bottom+8)+'px';
  menu.style.maxHeight = (window.innerHeight - bb.bottom - 24)+'px';
}
document.getElementById('lang-toggle').addEventListener('click',(e)=>{
  e.stopPropagation();
  const wrap=document.getElementById('lang-wrap');
  const menu=document.getElementById('lang-menu');
  const opening = !menu.classList.contains('open');
  wrap.classList.toggle('open', opening);
  menu.classList.toggle('open', opening);
  if(opening) positionLangMenu();
});
window.addEventListener('resize', ()=>{ if(document.getElementById('lang-menu').classList.contains('open')) positionLangMenu(); });
document.getElementById('lang-menu').addEventListener('click',(e)=>{
  const b=e.target.closest('.lang-opt'); if(!b) return;
  document.querySelectorAll('.lang-opt').forEach(x=>x.classList.toggle('active',x===b));
  state.lang = b.dataset.lang;
  document.getElementById('lang-current').textContent = b.dataset.label;
  document.getElementById('lang-wrap').classList.remove('open');
  document.getElementById('lang-menu').classList.remove('open');
  renderInstructions(PARTS[state.part]);
  translateChrome();
});
document.addEventListener('click',(e)=>{
  const wrap=document.getElementById('lang-wrap');
  const menu=document.getElementById('lang-menu');
  if(menu.classList.contains('open') && !wrap.contains(e.target) && !menu.contains(e.target)){
    wrap.classList.remove('open');
    menu.classList.remove('open');
  }
});
document.getElementById('names-toggle').addEventListener('click',()=>{
  state.namesMode=!state.namesMode;
  document.getElementById('names-toggle').classList.toggle('on',state.namesMode);
  document.getElementById('names-toggle-label').textContent = state.namesMode ? 'Original names' : 'Letters';
  renderInstructions(PARTS[state.part]);
});
/* On a phone the reader may have scrolled down to the instructions before
   tapping Next. If the draft is no longer on screen, bring it back so the
   new step's drawing is the first thing they see. */
function goStep(n){
  const tot=totalSteps(PARTS[state.part]);
  if(n<1||n>tot||n===state.step) return;
  state.step=n; render();
  if(isPhone()){
    const r=document.querySelector('.canvas-wrap').getBoundingClientRect();
    if(r.bottom<80) window.scrollTo({top:0,behavior:'smooth'});
  }
}
document.getElementById('prev-btn').onclick=()=>goStep(state.step-1);
document.getElementById('next-btn').onclick=()=>goStep(state.step+1);

// swipe on the draft or the preview: left = next step, right = previous
(function(){
  let x0=null, y0=null, t0=0;
  const zones=[document.querySelector('.canvas-wrap'), document.querySelector('.preview-wrap')];
  zones.forEach(z=>{
    z.addEventListener('touchstart',e=>{ if(e.touches.length!==1){x0=null;return;}
      x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now(); },{passive:true});
    z.addEventListener('touchend',e=>{ if(x0===null) return;
      const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
      x0=null;
      if(Date.now()-t0>700 || Math.abs(dx)<50 || Math.abs(dx)<Math.abs(dy)*1.4) return;
      goStep(state.step + (dx<0?1:-1));
    },{passive:true});
  });
})();

// phones: the full list of steps folds away under its title
document.getElementById('dag-title').addEventListener('click',()=>{
  if(isPhone()) document.querySelector('aside.dag').classList.toggle('open');
});

// keep the sticky progress bar directly under the (wrapping) header
function syncHeaderHeight(){
  document.documentElement.style.setProperty('--hdr-h', document.querySelector('header').offsetHeight+'px');
}
window.addEventListener('resize', syncHeaderHeight);
window.addEventListener('keydown',e=>{
  if(e.target && e.target.tagName==='INPUT') return;   // arrows move the caret while typing a measurement
  if(e.key==='ArrowRight') goStep(state.step+1);
  if(e.key==='ArrowLeft')  goStep(state.step-1);});

// --- SILAI: read initial garment + size from the host page (RoopVana) ------
// Mirrors exactly what the switcher (.sw-btn) and size-preset (.preset)
// click handlers above already do to state.part/state.size/state.m, so
// launching straight into a specific garment/size behaves identically to a
// person clicking those buttons themselves. Query string only (no
// postMessage): ?part=kurta_sleeve|kurta_sleeveless|blouse|trousers|shirt|skirt|tshirt,
// ?size=small|medium|large and ?lang=hi|ta|te|… (the language the request
// was made in: instructions are translated into it and read aloud in it).
function showStoreError(err){
  console.error(err);
  const host=document.getElementById('instr');
  if(host) host.innerHTML='<div class="instr-tip"><b>⚠ Pattern not loaded</b> <span>'
    +'The pattern could not be retrieved from the SILAI object store. Check the internet connection and reload.</span></div>';
}
const SILAI_READY = (async function(){
  const params = new URLSearchParams(window.location.search);
  const requestedPart = params.get('part');
  await SILAI.loadManifest();
  const startPart = (requestedPart && SILAI.garments().some(o=>o.id===requestedPart)) ? requestedPart : state.part;
  await SILAI.require(startPart);
  const requestedSize = params.get('size');
  const requestedLang = (params.get('lang') || '').trim().toLowerCase();

  if (requestedLang && requestedLang !== 'en') {
    const opts=[...document.querySelectorAll('.lang-opt')];
    const opt = opts.find(o=>o.dataset.lang.toLowerCase()===requestedLang)
             || opts.find(o=>o.dataset.lang.toLowerCase().split('-')[0]===requestedLang.split('-')[0]);
    if (opt) {
      opts.forEach(x=>x.classList.toggle('active', x===opt));
      state.lang = opt.dataset.lang;
      document.getElementById('lang-current').textContent = opt.dataset.label;
    }
  }

  if (requestedPart && PARTS[requestedPart]) {
    document.querySelectorAll('.sw-btn').forEach(x =>
      x.classList.toggle('active', x.dataset.part === requestedPart));
    // Launched from the host site already knowing the garment -- there's
    // nothing to switch to, so show just the one active button rather than
    // all seven (the switcher stays fully functional if ?part= is absent,
    // e.g. opening the file directly).
    document.querySelectorAll('.sw-btn').forEach(x => {
      x.style.display = (x.dataset.part === requestedPart) ? '' : 'none';
    });
    state.part = requestedPart;
    state.step = 1;
  }

  const chartForPart = CHARTS[PARTS[state.part].chart];
  const sizeKey = (requestedSize && chartForPart[requestedSize]) ? requestedSize : state.size;
  state.m = { ...chartForPart[sizeKey] };
  state.size = sizeKey;

  document.getElementById('dag-title').textContent=PARTS[state.part].label+' — DAG';
  syncHeaderHeight();
  renderFields(); render();
  translateChrome();
  // fetch the other garments in the background so the switcher is instant
  SILAI.garments().forEach(o=>SILAI.require(o.id).catch(()=>{}));
})().catch(showStoreError);
/* ═══ First-visit guided tour ═══════════════════════════════════════════
   Shown once per browser (localStorage 'silai.tour.seen'); the "?" button in
   the header replays it. Every title, text and button is translated into the
   studio language (state.lang, set from ?lang= by RoopVana) with the same
   translateText() used for the instructions. Steps whose target is hidden
   are skipped, so it works on phones and with a single garment button. */
const TOUR_STEPS=[
  {sel:null, t:'Welcome to SILAI Studio', d:'This studio shows you, step by step, how to draw the paper pattern for your garment and how to sew it. This short guide shows you around.'},
  {sel:'#switch', t:'Your garment', d:'This is the garment you are making. The pattern below is drawn for it.'},
  {sel:'#canvas-card', t:'The pattern', d:'The pattern is drawn here, one step at a time. New lines for this step are highlighted.'},
  {sel:'#preview-card', t:'How it will look', d:'This picture shows how the finished garment looks at this step.'},
  {sel:'.controls', t:'Move between steps', d:'Press Next to go to the next step and Prev to go back. The dots show how far you have come.'},
  {sel:'.sec-measure', t:'Your measurements', d:'Choose Small, Medium or Large, or type your own measurements in inches. The whole pattern changes to fit.'},
  {sel:'.sec-instr', t:'What to do', d:'Read what to draw and how to sew for this step here.'},
  {sel:'#listen-btn', t:'Listen', d:'Press Listen to hear this step read aloud. Tick Every step to hear each new step automatically.'},
  {sel:'#lang-wrap', t:'Language', d:'Change the language of the instructions and the voice here.'},
  {sel:'#theme-btn', t:'Background', d:'Switch between a white and a dark background. Your choice is remembered on this phone or computer.'},
  {sel:'#help-btn', t:'See this guide again', d:'Press this button any time to see this guide again. Happy sewing!'},
];
const TOUR_KEY='silai.tour.seen';
const tour={i:0, open:false, els:null};
function tourVisible(el){
  if(!el) return false;
  const r=el.getBoundingClientRect(); const cs=getComputedStyle(el);
  return r.width>0 && r.height>0 && cs.display!=='none' && cs.visibility!=='hidden';
}
function tourSteps(){ return TOUR_STEPS.filter(s=>!s.sel || tourVisible(document.querySelector(s.sel))); }
async function tourText(k){ return state.lang==='en' ? k : await translateText(k,state.lang); }
function tourBuild(){
  const block=document.createElement('div'); block.className='tour-block';
  const spot=document.createElement('div'); spot.className='tour-spot';
  const card=document.createElement('div'); card.className='tour-card'; card.setAttribute('role','dialog'); card.setAttribute('aria-modal','true');
  card.innerHTML='<h4></h4><p></p><div class="tour-count"></div><div class="tour-btns"><button class="skip"></button><span class="sp"></span><button class="back"></button><button class="primary next"></button></div>';
  document.body.append(block,spot,card);
  card.querySelector('.skip').onclick=()=>tourEnd();
  card.querySelector('.back').onclick=()=>tourGo(tour.i-1);
  card.querySelector('.next').onclick=()=>{ const n=tourSteps().length; tour.i>=n-1 ? tourEnd() : tourGo(tour.i+1); };
  block.onclick=e=>e.stopPropagation();
  tour.els={block,spot,card};
}
function tourPlace(){
  if(!tour.open) return;
  const steps=tourSteps(); const st=steps[tour.i]; if(!st) return;
  const {spot,card}=tour.els; const vw=innerWidth, vh=innerHeight, pad=6;
  const el=st.sel && document.querySelector(st.sel);
  const cw=card.offsetWidth, ch=card.offsetHeight;
  if(!el){
    spot.style.cssText='left:50%;top:50%;width:0;height:0';
    card.style.left=Math.max(12,(vw-cw)/2)+'px'; card.style.top=Math.max(12,(vh-ch)/2)+'px'; return;
  }
  const r=el.getBoundingClientRect();
  const top=Math.max(4,r.top-pad), left=Math.max(4,r.left-pad);
  const w=Math.min(vw-8,r.width+pad*2), h=Math.min(vh-8,r.bottom+pad-top);
  spot.style.cssText=`left:${left}px;top:${top}px;width:${w}px;height:${h}px`;
  let y;
  if(top+h+12+ch<=vh-8) y=top+h+12;            // below
  else if(top-12-ch>=8) y=top-12-ch;            // above
  else y=Math.max(8,vh-ch-8);                   // big target: pin to bottom
  let x=Math.min(Math.max(12,r.left+r.width/2-cw/2),vw-cw-12);
  card.style.left=x+'px'; card.style.top=y+'px';
}
async function tourGo(i){
  const steps=tourSteps(); i=Math.max(0,Math.min(i,steps.length-1)); tour.i=i;
  const st=steps[i]; const {card}=tour.els;
  const el=st.sel && document.querySelector(st.sel);
  if(el){
    // on phones the info panel sits below the canvas: bring the target into view first
    const r=el.getBoundingClientRect();
    if(r.top<0 || r.bottom>innerHeight) el.scrollIntoView({block: r.height>innerHeight*0.6?'start':'center'});
  }
  const rtl=['ur','ar'].includes(state.lang); card.dir=rtl?'rtl':'ltr';
  const last=i===steps.length-1;
  const keys=[st.t, st.d, 'Skip', 'Back', last?'Done':'Next'];
  // English first so the card never shows blank, then swap in the translation
  const paint=v=>{ card.querySelector('h4').textContent=v[0]; card.querySelector('p').textContent=v[1];
    card.querySelector('.skip').textContent=v[2]; const b=card.querySelector('.back'); b.textContent=v[3]; b.style.visibility=i?'visible':'hidden';
    card.querySelector('.next').textContent=v[4]; card.querySelector('.tour-count').textContent=`${i+1} / ${steps.length}`;
    requestAnimationFrame(tourPlace); };
  if(state.lang==='en'){ paint(keys); return; }
  card.classList.add('loading'); paint(keys);
  const lang=state.lang;
  let tr; try{ tr=await Promise.all(keys.map(tourText)); }catch(e){ tr=keys; }
  if(tour.i!==i || state.lang!==lang || !tour.open) return;
  card.classList.remove('loading'); paint(tr);
}
function tourStart(){
  if(tour.open) return;
  if(!tour.els) tourBuild();
  tour.open=true; Object.values(tour.els).forEach(e=>e.style.display='');
  window.scrollTo(0,0); tourGo(0);
}
function tourEnd(){
  tour.open=false; if(tour.els) Object.values(tour.els).forEach(e=>e.style.display='none');
  try{ localStorage.setItem(TOUR_KEY,'1'); }catch(e){}
}
addEventListener('resize',tourPlace); addEventListener('scroll',tourPlace,true);
addEventListener('keydown',e=>{ if(tour.open && e.key==='Escape') tourEnd(); },true);
document.getElementById('help-btn').onclick=()=>tourStart();
// background switch: white <-> dark, remembered in localStorage['silai.theme']
(function(){
  const btn=document.getElementById('theme-btn');
  const paint=()=>{ const light=document.documentElement.getAttribute('data-theme')==='light';
    btn.textContent=light?'\u263E':'\u2600'; btn.setAttribute('aria-pressed',String(light)); };
  btn.onclick=()=>{
    const next=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
    document.documentElement.setAttribute('data-theme',next);
    try{ localStorage.setItem('silai.theme',next); }catch(e){}
    paint();
  };
  paint();
})();
// translate the "?" tooltip too
(async()=>{ const b=document.getElementById('help-btn'); const t=await tourText('Show the guide again'); b.title=t; b.setAttribute('aria-label',t); })();
(function(){
  let seen=false; try{ seen=localStorage.getItem(TOUR_KEY)==='1'; }catch(e){}
  if(new URLSearchParams(location.search).get('tour')==='1') seen=false;   // ?tour=1 forces it (testing)
  if(!seen) SILAI_READY.then(()=>setTimeout(tourStart, 400));
})();
</script>
</body>
