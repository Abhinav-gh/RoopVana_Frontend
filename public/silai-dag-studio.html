<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Silai · DAG Studio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d0d0f;--surface:#151519;--panel:#1b1b21;--panel2:#212129;--border:#26262f;--border-soft:#1f1f26;
    --accent:#f59e0b;--accent2:#fbbf24;--accent-dim:rgba(245,158,11,.12);
    --red:#f0524a;--blue:#4a90f5;--green:#2fc774;--purple:#b062f2;
    --text:#eeeef4;--text2:#9393a8;--text3:#57576a;
    --ease:cubic-bezier(.22,.85,.32,1);--ease-fast:cubic-bezier(.3,.9,.4,1);
    --radius:12px;--radius-sm:8px;
  }
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:2px solid var(--surface)}
  ::-webkit-scrollbar-thumb:hover{background:var(--text3)}

  header{height:56px;background:linear-gradient(180deg,var(--surface),var(--bg));border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:14px;flex-shrink:0;backdrop-filter:blur(6px)}
  .logo{font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--accent)}
  .logo span{color:var(--text2);font-weight:400}

  .switch{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:3px;gap:1px}
  .sw-btn{padding:7px 13px;border:none;background:none;color:var(--text2);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;border-radius:8px;transition:background .22s var(--ease),color .22s var(--ease),transform .15s var(--ease-fast);white-space:nowrap}
  .sw-btn:hover{color:var(--text)}
  .sw-btn.active{background:var(--accent);color:#000;box-shadow:0 2px 10px rgba(245,158,11,.35)}
  .sw-btn:active{transform:scale(.96)}

  .tag{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;border:1px solid var(--border);padding:4px 9px;border-radius:6px}
  .spacer{margin-left:auto}

  /* names toggle — pill switch */
  .names-toggle{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--panel);padding:5px 10px 5px 5px;border-radius:20px;cursor:pointer;color:var(--text2);font-family:inherit;font-size:11.5px;font-weight:600;transition:border-color .2s var(--ease),color .2s var(--ease)}
  .names-toggle:hover{border-color:var(--accent);color:var(--text)}
  .nt-track{width:30px;height:17px;border-radius:20px;background:var(--bg);border:1px solid var(--border);position:relative;transition:background .22s var(--ease)}
  .nt-thumb{position:absolute;top:1px;left:1px;width:13px;height:13px;border-radius:50%;background:var(--text3);transition:transform .24s var(--ease),background .22s var(--ease)}
  .names-toggle.on .nt-track{background:rgba(245,158,11,.18);border-color:var(--accent)}
  .names-toggle.on .nt-thumb{transform:translateX(13px);background:var(--accent)}
  .names-toggle.on{color:var(--accent2)}

  /* Custom language switcher — our own styled dropdown, no Google banner or
     cross-origin iframe involved. Translates only the instruction panel
     (the "How to draft & sew" text), via a plain fetch call. */
  .lang-wrap{position:relative;display:flex;align-items:center}
  .lang-toggle{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--text2);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:border-color .18s var(--ease),color .18s var(--ease)}
  .lang-toggle:hover{border-color:var(--accent);color:var(--text)}
  .lang-wrap.open .lang-toggle{border-color:var(--accent);color:var(--accent2)}
  .lang-caret{font-size:9px;color:var(--text3);transition:transform .18s var(--ease)}
  .lang-wrap.open .lang-caret{transform:rotate(180deg)}
  .lang-menu{position:fixed;z-index:80;display:none;
    max-height:290px;overflow-y:auto;background:var(--panel2);border:1px solid var(--border);
    border-radius:11px;padding:6px;box-shadow:0 14px 34px rgba(0,0,0,.5);
    opacity:0;transform:translateY(-4px);transition:opacity .16s var(--ease),transform .16s var(--ease)}
  .lang-wrap.open .lang-menu{display:block;opacity:1;transform:none}
  .lang-menu.open{display:block;opacity:1;transform:none}
  .lang-opt{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:7px;border:none;background:none;color:var(--text2);font-family:inherit;font-size:12.5px;cursor:pointer;transition:background .13s var(--ease)}
  .lang-opt:hover{background:var(--panel)}
  .lang-opt.active{background:var(--accent-dim);color:var(--accent2);font-weight:600}
  .lang-loading{opacity:.6;pointer-events:none}

  .progress-rail{height:2.5px;background:var(--border-soft);flex-shrink:0}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .38s var(--ease)}

  .app{display:flex;flex:1;overflow:hidden}
  aside.dag{width:314px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;padding:14px 0}
  .dag-title{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--text3);font-weight:600;padding:0 18px 10px}
  .phase-hdr{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:700;padding:14px 18px 7px;display:flex;align-items:center;gap:8px}
  .phase-hdr .pl{height:1px;flex:1;background:var(--border)}

  .node{position:relative;margin:0 12px 4px;padding:11px 12px 11px 44px;border-radius:var(--radius-sm);cursor:pointer;transition:background .18s var(--ease),border-color .18s var(--ease),transform .12s var(--ease-fast);border:1px solid transparent}
  .node:hover{background:var(--panel);transform:translateX(1px)}
  .node.active{background:var(--accent-dim);border-color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}
  .node.done .num{background:var(--accent);color:#000;border-color:var(--accent)}
  .node.locked{opacity:.45}
  .num{position:absolute;left:12px;top:11px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--text2);z-index:2;transition:background .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease)}
  .node.active .num{border-color:var(--accent);color:var(--accent)}
  .node::before{content:'';position:absolute;left:22.5px;top:-4px;width:1.5px;height:15px;background:var(--border)}
  .node.first::before{display:none}
  .node .hi{font-size:13px;font-weight:600;color:var(--text);line-height:1.3}
  .node .formula{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);opacity:.9;margin-top:6px;max-height:0;overflow:hidden;transition:max-height .22s var(--ease),margin-top .22s var(--ease)}
  .node.active .formula{display:block;max-height:40px;margin-top:6px}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
  .chip{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 6px;border-radius:5px;background:var(--bg);border:1px solid var(--border);color:var(--text3)}
  .chip.dep{color:var(--blue);border-color:rgba(74,144,245,.35)}
  .chip.man{color:var(--purple);border-color:rgba(176,98,242,.4)}
  .chip.cross{color:var(--green);border-color:rgba(47,199,116,.4)}
  .badge-man{position:absolute;right:11px;top:11px;font-size:11px;color:var(--purple)}

  main{flex:1;display:flex;flex-direction:column;background:
       radial-gradient(circle at 30% 0%,rgba(245,158,11,.04),transparent 45%) , var(--bg);overflow:hidden}
  .canvas-wrap{flex:1.35;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:26px;
    background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:22px 22px}
  .stage-row{flex:1;display:flex;overflow:hidden;border-bottom:1px solid var(--border)}
  .preview-wrap{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:22px 26px;gap:12px;border-left:1px solid var(--border);
    background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px);background-size:22px 22px}
  .preview-title{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--text3);font-weight:600}
  .preview-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;
    box-shadow:0 18px 44px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;overflow:hidden;
    transition:width .38s var(--ease),height .38s var(--ease)}
  .canvas-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;
    box-shadow:0 22px 55px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.02);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    transition:width .38s var(--ease),height .38s var(--ease)}
  #stage{width:100%;height:100%;display:block}

  @keyframes stepIn{from{opacity:.35;transform:translateY(5px) scale(.995)}to{opacity:1;transform:none}}
  .step-in{animation:stepIn .34s var(--ease)}

  .controls{height:58px;border-top:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:12px;padding:0 18px;flex-shrink:0}
  .step-readout{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text2)}
  .step-readout b{color:var(--accent)}
  .dots{display:flex;gap:5px;margin:0 6px;flex-wrap:wrap;max-width:280px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--border);cursor:pointer;transition:background .18s var(--ease),transform .15s var(--ease-fast)}
  .dot:hover{transform:scale(1.3)}
  .dot.on{background:var(--accent);box-shadow:0 0 0 3px rgba(245,158,11,.2)}
  .dot.done{background:var(--text3)}
  .dot.sep{margin-left:7px}

  .btn{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:border-color .18s var(--ease),color .18s var(--ease),transform .12s var(--ease-fast)}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn:active{transform:scale(.96)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#000}
  .btn.primary:hover{background:var(--accent2);color:#000}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none}

  .anchor{fill:var(--accent);stroke:#000;stroke-width:1.2;transition:r .15s var(--ease)}
  .anchor.dim{fill:var(--text3);opacity:.55}
  .anchor.small{fill:var(--blue)}
  .alabel{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;fill:var(--accent2);paint-order:stroke;stroke:#0d0d0f;stroke-width:2.6px;stroke-linejoin:round}
  .alabel.dim{fill:var(--text2);opacity:.75}
  .aform{font-family:'JetBrains Mono',monospace;font-size:7.5px;fill:#a6a6bd;paint-order:stroke;stroke:#0d0d0f;stroke-width:2.2px;stroke-linejoin:round}
  .dimtxt{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;fill:#f0f1f8;paint-order:stroke;stroke:#0d0d0f;stroke-width:2.8px;stroke-linejoin:round}

  aside.info{width:304px;background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;flex-shrink:0}
  .sec{padding:16px 17px;border-bottom:1px solid var(--border)}
  .sec-title{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--text3);margin-bottom:12px;font-weight:600}

  .preset-row{display:flex;gap:6px;margin-bottom:12px}
  .preset{flex:1;padding:7px 0;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text2);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;transition:border-color .18s var(--ease),color .18s var(--ease),background .18s var(--ease)}
  .preset:hover{border-color:var(--accent);color:var(--accent)}
  .preset.active{background:var(--accent);border-color:var(--accent);color:#000}

  .fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .field{margin:0}
  .field label{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text2);margin-bottom:4px}
  .field label .ex{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--accent);opacity:.8}
  .field input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:6px 8px;font-family:'JetBrains Mono',monospace;font-size:12px;transition:border-color .18s var(--ease)}
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,158,11,.12)}

  .garment{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
  .garment-cap{font-size:11px;color:var(--text2);line-height:1.6;text-align:center;max-width:340px}

  .instr-head{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;margin-bottom:11px}
  .instr-list{margin:0;padding-left:17px}
  .instr-list li{font-size:12px;color:var(--text);line-height:1.6;margin-bottom:7px}
  .instr-list li::marker{color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px}
  .instr-sew{margin-top:12px;padding:10px 12px;border-radius:9px;background:rgba(47,199,116,.08);border:1px solid rgba(47,199,116,.28);font-size:11px;color:var(--text2);line-height:1.55}
  .instr-sew b{color:var(--green);font-weight:600;margin-right:4px}
  .instr-tip{margin-top:9px;padding:10px 12px;border-radius:9px;background:var(--accent-dim);border:1px solid rgba(245,158,11,.28);font-size:11px;color:var(--text2);line-height:1.55}
  .instr-tip b{color:var(--accent2);font-weight:600;margin-right:4px}
  .instr-warn{margin-top:9px;padding:10px 12px;border-radius:9px;background:rgba(240,82,74,.09);border:1px solid rgba(240,82,74,.32);font-size:11px;color:var(--text2);line-height:1.55}

  @media (max-width:900px){
    aside.dag{width:230px}
    aside.info{width:230px}
  }
</style>
</head>
<body>
<header>
  <div class="logo">SILAI<span>·studio</span></div>
  <div class="switch" id="switch">
    <button class="sw-btn active" data-part="kurta_sleeve">👕 Kurta Sleeve</button>
    <button class="sw-btn" data-part="kurta_sleeveless">🎽 Sleeveless</button>
    <button class="sw-btn" data-part="blouse">👚 Blouse</button>
    <button class="sw-btn" data-part="trousers">👖 Trousers</button>
    <button class="sw-btn" data-part="shirt">👔 Men's Shirt</button>
  </div>
  <div class="tag" id="tag">parametric · live L·S·C</div>
  <div class="spacer"></div>
  <button class="names-toggle" id="names-toggle" title="Switch between point letters and their plain-English names">
    <span class="nt-track"><span class="nt-thumb"></span></span>
    <span class="nt-label" id="names-toggle-label">Letters</span>
  </button>
  <div class="lang-wrap" id="lang-wrap">
    <button class="lang-toggle" id="lang-toggle" title="Translate the instructions">
      🌐 <span id="lang-current">English</span> <span class="lang-caret">▾</span>
    </button>
    <div class="lang-menu" id="lang-menu">
      <button class="lang-opt active" data-lang="en" data-label="English">English</button>
      <button class="lang-opt" data-lang="hi" data-label="हिन्दी">हिन्दी · Hindi</button>
      <button class="lang-opt" data-lang="bn" data-label="বাংলা">বাংলা · Bengali</button>
      <button class="lang-opt" data-lang="ta" data-label="தமிழ்">தமிழ் · Tamil</button>
      <button class="lang-opt" data-lang="te" data-label="తెలుగు">తెలుగు · Telugu</button>
      <button class="lang-opt" data-lang="mr" data-label="मराठी">मराठी · Marathi</button>
      <button class="lang-opt" data-lang="gu" data-label="ગુજરાતી">ગુજરાતી · Gujarati</button>
      <button class="lang-opt" data-lang="kn" data-label="ಕನ್ನಡ">ಕನ್ನಡ · Kannada</button>
      <button class="lang-opt" data-lang="ml" data-label="മലയാളം">മലയാളം · Malayalam</button>
      <button class="lang-opt" data-lang="pa" data-label="ਪੰਜਾਬੀ">ਪੰਜਾਬੀ · Punjabi</button>
      <button class="lang-opt" data-lang="ur" data-label="اردو">اردو · Urdu</button>
      <button class="lang-opt" data-lang="as" data-label="অসমীয়া">অসমীয়া · Assamese</button>
      <button class="lang-opt" data-lang="or" data-label="ଓଡ଼ିଆ">ଓଡ଼ିଆ · Odia</button>
      <button class="lang-opt" data-lang="es" data-label="Español">Español · Spanish</button>
      <button class="lang-opt" data-lang="fr" data-label="Français">Français · French</button>
      <button class="lang-opt" data-lang="pt" data-label="Português">Português · Portuguese</button>
      <button class="lang-opt" data-lang="ar" data-label="العربية">العربية · Arabic</button>
      <button class="lang-opt" data-lang="sw" data-label="Kiswahili">Kiswahili · Swahili</button>
      <button class="lang-opt" data-lang="id" data-label="Indonesia">Bahasa Indonesia</button>
      <button class="lang-opt" data-lang="zh-CN" data-label="中文">中文 · Chinese</button>
    </div>
  </div>
</header>
<div class="progress-rail"><div class="progress-fill" id="progress-fill"></div></div>
<div class="app">
  <aside class="dag"><div class="dag-title" id="dag-title">Drafting DAG</div><div id="dag-nodes"></div></aside>
  <main>
    <div class="stage-row">
      <div class="canvas-wrap"><div class="canvas-card" id="canvas-card"><svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg></div></div>
      <div class="preview-wrap">
        <div class="preview-title" id="garment-title">Finished kurti — this step</div>
        <div class="preview-card" id="preview-card"><div class="garment" id="garment"></div></div>
        <div class="garment-cap" id="garment-cap"></div>
      </div>
    </div>
    <div class="controls">
      <button class="btn" id="prev-btn">← Prev</button>
      <div class="dots" id="dots"></div>
      <button class="btn primary" id="next-btn">Next →</button>
      <div class="step-readout" id="readout"></div>
    </div>
  </main>
  <aside class="info">
    <div class="sec">
      <div class="sec-title">Base body size — variables L·S·C…</div>
      <div id="measure"></div>
    </div>
    <div class="sec">
      <div class="sec-title">How to draft &amp; sew — this step</div>
      <div id="instr"></div>
    </div>
  </aside>
</div>
<script>
/* ═══════════════════════════════════════════════════════════════════
   SILAI DAG STUDIO — fully parametric.
   Fixed formulas & angles; the variables L,S,C,H,W,SL,B drive everything.
   Base-size presets (Small/Medium/Large) from the corpus measurement chart, or
   edit any field. Every point, curve, dimension and instruction recomputes.
   ═══════════════════════════════════════════════════════════════════ */
const ALL_FIELDS = [
  {id:'C', label:'Chest (C)',     ex:'C',  def:36},
  {id:'S', label:'Shoulder (S)',  ex:'S',  def:15},
  {id:'H', label:'Hip (H)',       ex:'H',  def:38},
  {id:'W', label:'Waist (W)',     ex:'W',  def:30},
  {id:'L', label:'Length (L)',    ex:'L',  def:38},
  {id:'FL',label:'Full length (FL)',ex:'FL',def:39},
  {id:'BL',label:'Belt length (BL)',ex:'BL',def:1.5},
  {id:'SL',label:'Sleeve len',    ex:'SL', def:7},
  {id:'Bm',label:'Armhole (B)',   ex:'B',  def:12},
  {id:'PL',label:'Pocket length (PL)',ex:'PL',def:13},
  {id:'Wd',label:'Waist drop',    ex:'A→G',def:15},
  {id:'N', label:'Neck (N)',      ex:'N',  def:17},
  {id:'CF',label:'Cuff depth (CF)',ex:'CF',def:2},
  {id:'CR',label:'Cuff round (CR)',ex:'CR',def:9.5},
];
// Corpus measurement chart (Chapter 8). Wd (waist drop) is a drafting constant.
const SIZE_CHART = {
  small:  {C:32, S:14,   H:34, W:26, L:36, SL:6,   Bm:11,   Wd:15},
  medium: {C:34, S:14.5, H:36, W:28, L:37, SL:6.5, Bm:11.5, Wd:15},
  large:  {C:36, S:15,   H:38, W:30, L:38, SL:7,   Bm:12,   Wd:15},
};
// Men's shirt chart (USHA Silai School, Part B — nाप तालिका, Ch. "पुरुषों की शर्ट")
const SHIRT_CHART = {
  small:  {L:30, S:18, C:36, SL:23.5, N:16, CF:2, CR:9},
  medium: {L:31, S:19, C:38, SL:24,   N:17, CF:2, CR:9.5},

/* ═══ INSTRUCTION TRANSLATION ══════════════════════════════════════════
   Own dropdown UI (no Google banner, no cross-origin iframe to fight with).
   Tries Google's public translate endpoint first (no API key), falls back
   to MyMemory's free API if that fails, and only then gives up and shows
   English with a visible warning — it never fails silently. Results are
   cached per (lang,text) so re-visiting a step never re-fetches. */
const TCACHE = {};
let lastTranslateError = null;
async function tryGoogle(text, lang){
  const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${encodeURIComponent(lang)}&dt=t&q=${encodeURIComponent(text)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`google endpoint ${res.status}`);
  const data = await res.json();
  const out = (data[0]||[]).map(chunk=>chunk[0]).join('');
  if(!out) throw new Error('google endpoint returned empty result');
  return out;
}
async function tryMyMemory(text, lang){
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|${encodeURIComponent(lang)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`mymemory endpoint ${res.status}`);
  const data = await res.json();
  const out = data && data.responseData && data.responseData.translatedText;
  if(!out) throw new Error('mymemory endpoint returned empty result');
  return out;
}
async function translateText(text, lang){
  if(!text || lang==='en') return text;
  TCACHE[lang] = TCACHE[lang] || {};
  if(TCACHE[lang][text] !== undefined) return TCACHE[lang][text];
  try{
    const out = await tryGoogle(text, lang);
    TCACHE[lang][text] = out;
    lastTranslateError = null;
    return out;
  }catch(err1){
    console.warn('[SILAI translate] Google endpoint failed, trying MyMemory:', err1);
    try{
      const out = await tryMyMemory(text, lang);
      TCACHE[lang][text] = out;
      lastTranslateError = null;
      return out;
    }catch(err2){
      console.error('[SILAI translate] both translation providers failed:', err2);
      lastTranslateError = (location.protocol==='file:')
        ? 'Translation needs this page served over http(s) — opening it as a local file (file://) blocks the network request in most browsers. Try running a tiny local server (e.g. "npx serve" in this folder) and opening it from http://localhost instead, or host it anywhere and open it from a URL.'
        : `Both translation services are unreachable right now (${err2.message}). Showing English instead.`;
      return text;
    }
  }
}

// Catmull-Rom spline through points → smooth French-curve path (for the sleeve cap)
function crPath(pts,g0,g1){
  if(pts.length<2) return '';
  let d = `M ${pts[0].x.toFixed(2)} ${pts[0].y.toFixed(2)}`;
  for(let i=0;i<pts.length-1;i++){

    const c1={x:p1.x+(p2.x-p0.x)/6, y:p1.y+(p2.y-p0.y)/6};
    const c2={x:p2.x-(p3.x-p1.x)/6, y:p2.y-(p3.y-p1.y)/6};
    d += ` C ${c1.x.toFixed(2)} ${c1.y.toFixed(2)} ${c2.x.toFixed(2)} ${c2.y.toFixed(2)} ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;

}

/* ═══ ORIGINAL-NAME MODE ══════════════════════════════════════════════
   Every drafted point already carries a corpus-accurate `note` (e.g.
   'chest·fold', 'shoulder tip'). Instead of hand-writing a second copy of
   every instruction, we derive a human name from that same note and
   substitute it into the instruction prose wherever a point letter is
   referenced in an unambiguous pattern (after "point/mark/Join/From/at/to",
   inside parentheses, or either side of a "→"/"–"). Bare letters used mid
   -sentence in a way we can't safely disambiguate from ordinary English are
   left as-is — this keeps the substitution 100% safe against misfires like
   turning the word "A" (article) or "I" (pronoun) into a garment point. */
function nameForNote(note){
  if(!note) return null;
  const parts = note.split('·').map(s=>s.trim()).filter(Boolean);
  if(!parts.length) return null;
  let main = parts[0], qual = parts[1];
  if(/^(ref|box)$/i.test(main)) return null;
  main = main.replace(/\bctr\b/gi,'center');
  const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
  const noun = /point|apex|corner|tip|seam|curve|dart|line|width|depth/i;
  let base = noun.test(main) ? cap(main) : `${cap(main)} point`;
  if(qual) base += /side/i.test(qual) ? ` (${qual})` : ` (${qual} side)`;
  return base;
}
function buildNames(ph, pt){
  const names={};
  Object.entries(ph.letters||{}).forEach(([key,disp])=>{
    const p = pt[key]; if(!p) return;
    const nm = nameForNote(p.note);
    if(nm) names[disp]=nm;
  });
  return names;
}
function humanize(text, names){
  if(!text || !names || !Object.keys(names).length) return text;
  const tok = '([A-Z]{1,2}[0-9]?)';
  const decap = s => s.charAt(0).toLowerCase()+s.slice(1);
  let out = text;
  // "chest point F" / "the waist point H" — the landmark noun already duplicates
  // the name we're about to substitute, so swallow noun+point together first.
  out = out.replace(new RegExp(`\\b(chest|waist|hip|shoulder|neck|hem|underarm|fold|side|back|front)\\s+point\\s*\\(?${tok}\\)?`,'gi'),
    (m,noun,a)=> names[a] ? decap(names[a]) : m);
  out = out.replace(new RegExp(`\\bJoin ${tok}[–-]${tok}\\b`,'g'), (m,a,b)=> (names[a]&&names[b]) ? `Join the ${names[a]} to the ${names[b]}` : m);
  out = out.replace(new RegExp(`\\bmark point ${tok}\\b`,'g'), (m,a)=> names[a] ? `mark the ${names[a]}` : m);
  out = out.replace(new RegExp(`\\bpoint ${tok}\\b`,'g'), (m,a)=> names[a] ? `the ${names[a]}` : m);
  out = out.replace(new RegExp(`\\bmark ${tok}\\b`,'g'), (m,a)=> names[a] ? `mark the ${names[a]}` : m);
  out = out.replace(new RegExp(`\\bFrom ${tok},`,'g'), (m,a)=> names[a] ? `From the ${names[a]},` : m);
  out = out.replace(new RegExp(`${tok}→${tok}`,'g'), (m,a,b)=> (names[a]&&names[b]) ? `${names[a]} → ${names[b]}` : m);
  out = out.replace(new RegExp(`\\b${tok}–${tok}\\b`,'g'), (m,a,b)=> (names[a]&&names[b]) ? `${names[a]}–${names[b]}` : m);
  out = out.replace(new RegExp(`\\b(at|to|toward|near) ${tok}\\b`,'g'), (m,w,a)=> names[a] ? `${w} the ${names[a]}` : m);
  out = out.replace(new RegExp(`\\(${tok}\\)`,'g'), (m,a)=> names[a] ? `(${names[a]})` : m);
  return out;
}

/* front armhole cubic M→E (leans right of C–L) — shared by points() and edges() */
function bArm(M,E){ const ax=E.x-M.x, ay=E.y-M.y, al=Math.hypot(ax,ay)||1, aux=ax/al, auy=ay/al;
  let nx=auy, ny=-aux; if(nx<0){nx=-nx;ny=-ny;}
  const at=(t)=>({x:M.x+t*ax,y:M.y+t*ay}), c1=at(0.30), c2=at(0.72);
  return {nx,ny, f1:{x:c1.x+1.0*nx,y:c1.y+1.0*ny}, f2:{x:c2.x+0.7*nx,y:c2.y+0.7*ny},
                 b1:{x:c1.x+0.5*nx,y:c1.y+0.5*ny}, b2:{x:c2.x+0.2*nx,y:c2.y+0.2*ny}}; }
function bezAt(p0,c1,c2,p3,t){ const u=1-t;
  return {x:u*u*u*p0.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*p3.x,
          y:u*u*u*p0.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*p3.y}; }
// 7.8 · the "most slanted point" — where a curve leans furthest from its chord
function maxLean(p0,c1,c2,p3){ const dx=p3.x-p0.x, dy=p3.y-p0.y, L=Math.hypot(dx,dy)||1;
  let best={d:-1,p:p0};
  for(let i=1;i<200;i++){ const t=i/200, q=bezAt(p0,c1,c2,p3,t);
    const d=Math.abs((q.x-p0.x)*dy-(q.y-p0.y)*dx)/L;
    if(d>best.d) best={d,p:q}; }
  return best.p; }
// stitching-allowance legs: offset ±d square to the dart at its wide end, back to the apex
function dartLegs(tip,base,d,axis){ const dx=tip.x-base.x, dy=tip.y-base.y, l=Math.hypot(dx,dy)||1;
  let ox=-dy/l*d, oy=dx/l*d;                       // default: square to the dart
  if(axis==='v'){ ox=0; oy=d; }                    // point sits on a vertical edge
  if(axis==='h'){ ox=d; oy=0; }                    // point sits on the hem
  const f=(n)=>n.toFixed(2);
  return `M ${f(tip.x+ox)} ${f(tip.y+oy)} L ${f(base.x)} ${f(base.y)} `
       + `M ${f(tip.x-ox)} ${f(tip.y-oy)} L ${f(base.x)} ${f(base.y)}`; }

function fmt2(p){return `${p.x.toFixed(2)} ${p.y.toFixed(2)}`;}
function blouseGarment(m){
  const C=m.C,W=m.W,S=m.S,L=m.L,SL=m.SL,B=m.Bm;
  const NWd=C/12+0.5, ND=C/6, BND=C/8, SH=S/2, SS=C/36-0.3, CP=C/4-1, CH=C/4+1, WH=W/4+1.25, mori=B/2, slProj=SL*0.9;
  // right-half key points (inches, x>=0 from centre, y down)
  const HR={x:NWd,y:0}, G={x:0,y:ND}, M={x:SH,y:SS}, E={x:CH,y:CP}, F={x:WH,y:L};
  // the sleeve is a cone set into the armhole chord M→E and drooped downward:
  // ax = the chord normal rotated DROOP toward the hem, cw = the mori edge direction
  const aL=Math.hypot(E.x-M.x,E.y-M.y)||1, dxn=(E.x-M.x)/aL, dyn=(E.y-M.y)/aL;
  const DROOP=45*Math.PI/180, cs=Math.cos(DROOP), sn=Math.sin(DROOP);
  const ax={x:dyn*cs+dxn*sn, y:dyn*sn-dxn*cs};            // sleeve axis · out and down
  const cw={x:-ax.y, y:ax.x};                             // down the mori edge
  const mid={x:(M.x+E.x)/2, y:(M.y+E.y)/2};
  const cc={x:mid.x+slProj*ax.x, y:mid.y+slProj*ax.y};    // centre of the mori edge
  const capO={x:cc.x-(mori/2)*cw.x, y:cc.y-(mori/2)*cw.y};  // outer top of the sleeve
  const slO ={x:cc.x+(mori/2)*cw.x, y:cc.y+(mori/2)*cw.y};  // outer hem · mori = B/2
  // named control points — shared by the outline and the highlight paths
  const along=(a,b,t,o,v)=>({x:a.x+(b.x-a.x)*t+o*v.x, y:a.y+(b.y-a.y)*t+o*v.y});
  const shC1={x:(NWd+SH)/2,y:SS*0.3}, shC2={x:SH-0.5,y:SS};
  const capC1=along(M,capO,0.35,-0.75,cw), capC2=along(M,capO,0.78,-0.55,cw);
  const cufC1=along(capO,slO,0.30,0.35,ax), cufC2=along(capO,slO,0.70,0.35,ax);
  const uaC1=along(slO,E,0.35,0.35,cw),     uaC2=along(slO,E,0.72,0.25,cw);
  const sdC1={x:(E.x+F.x)/2+0.5,y:(E.y+F.y)/2}, sdC2={x:F.x+0.3,y:F.y-1.6};
  const hmC1={x:WH*0.6,y:L}, hmC2={x:WH*0.3,y:L};
  // armhole M→E is a scoop, not a chord: offset the controls square to M–E and
  // toward the centre front, the same way the Part-1 draft builds it
  const aLb=Math.hypot(E.x-M.x,E.y-M.y)||1, auxb=(E.x-M.x)/aLb, auyb=(E.y-M.y)/aLb;
  const anxb=-auyb, anyb=auxb;                       // square to M–E, pointing inward
  const apb=(t)=>({x:M.x+t*(E.x-M.x), y:M.y+t*(E.y-M.y)});
  const ahC1={x:apb(0.30).x+1.10*anxb, y:apb(0.30).y+1.10*anyb};
  const ahC2={x:apb(0.72).x+0.80*anxb, y:apb(0.72).y+0.80*anyb};
  // right-half outline segments HR -> hemCentre, each a cubic {c1,c2,end}
  const R=[
    {c1:shC1, c2:shC2,  end:M},           // shoulder
    {c1:capC1,c2:capC2, end:capO},        // sleeve cap · slopes downward
    {c1:cufC1,c2:cufC2, end:slO},         // sleeve hem · mori
    {c1:uaC1, c2:uaC2,  end:E},           // underarm back up to the armpit
    {c1:sdC1, c2:sdC2,  end:F},           // side seam (tapers in)
    {c1:hmC1, c2:hmC2,  end:{x:0,y:L}},   // hem -> centre
  ];
  // interior construction points — the very numbers Part 1 drafts with, so the
  // little blouse carries the same darts the manual's step thumbnails show
  const bustY=C/4+1;
  const dP={x:0,y:bustY}, dQ={x:3.5,y:bustY}, dR={x:5,y:bustY}, dS={x:2,y:bustY};
  const dU={x:3.5,y:bustY+1}, dT={x:3.5,y:L}, dV={x:CH,y:CP+C/8};
  const dW=maxLean(M,ahC1,ahC2,E), dX={x:(dW.x+dQ.x)/2,y:(dW.y+dQ.y)/2};
  const dT2={x:3.5,y:L-2.5};
  const tYb=(0-dV.x)/((dT2.x-dV.x)||1), dY={x:0,y:dV.y+tYb*(dT2.y-dV.y)}, dZ={x:0,y:dY.y-0.5};
  const neckL={c1:{x:-NWd,y:ND*0.55},c2:{x:-NWd*0.45,y:ND},end:G};
  const neckR={c1:{x:NWd*0.45,y:ND},c2:{x:NWd,y:ND*0.55},end:HR};
  // assemble full path (inches)
  const HL={x:-NWd,y:0};
  let segs=[];
  segs.push(['M',HL]);
  segs.push(['C',neckL.c1,neckL.c2,neckL.end]);
  segs.push(['C',neckR.c1,neckR.c2,neckR.end]);
  R.forEach(s=>segs.push(['C',s.c1,s.c2,s.end]));
  // left = mirror(reverse(R)) : from hemCentre back up to HL
  let prev={x:0,y:L};
  for(let i=R.length-1;i>=0;i--){ const s=R[i];
    const start = i===0 ? HR : R[i-1].end;                 // original start of segment i
    // reverse cubic: prev(=s.end mirrored side) -> start, controls swapped, x negated
    segs.push(['C',{x:-s.c2.x,y:s.c2.y},{x:-s.c1.x,y:s.c1.y},{x:-start.x,y:start.y}]);
    prev={x:-start.x,y:start.y};
  }
  segs.push(['Z']);
  // ---- fit to viewBox: collect all pts, scale, centre ----
  const pts=[]; segs.forEach(s=>{ for(let i=1;i<s.length;i++) pts.push(s[i]); });
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const spanX=maxX-minX, spanY=maxY-minY;
  const TW=134, TH=168, k=Math.min(TW/spanX, TH/spanY);
  const ox=70-((minX+maxX)/2)*k, oy=97-((minY+maxY)/2)*k;
  const T=p=>({x:p.x*k+ox, y:p.y*k+oy});
  const base=segs.map(s=> s[0]==='M'?`M ${fmt2(T(s[1]))}`: s[0]==='Z'?'Z': `C ${fmt2(T(s[1]))} ${fmt2(T(s[2]))} ${fmt2(T(s[3]))}`).join(' ');
  // ---- highlights (same transform) ----
  const seg=(a,b)=>`M ${fmt2(T(a))} L ${fmt2(T(b))}`;
  const cub=(a,c1,c2,e)=>`M ${fmt2(T(a))} C ${fmt2(T(c1))} ${fmt2(T(c2))} ${fmt2(T(e))}`;
  const mir=(p)=>({x:-p.x,y:p.y});                       // left half = mirror of right
  const pair=(a,c1,c2,e)=>cub(a,c1,c2,e)+' '+cub(mir(a),mir(c1),mir(c2),mir(e));
  const segM=(a,b)=>seg(a,b)+' '+seg(mir(a),mir(b));
  // Step #8 wedge: ±d at the wide end of a dart, both legs back to its apex
  const wedge=(tip,base,d,axis)=>{ const dx=tip.x-base.x, dy=tip.y-base.y, l=Math.hypot(dx,dy)||1;
    let ox=-dy/l*d, oy=dx/l*d;
    if(axis==='v'){ox=0;oy=d;} if(axis==='h'){ox=d;oy=0;}
    return segM({x:tip.x+ox,y:tip.y+oy},base)+' '+segM({x:tip.x-ox,y:tip.y-oy},base); };
  const dartsPath = segM(dS,dP)+' '+segM(dU,dT)+' '+segM(dR,dV)+' '+segM(dW,dX);
  const plain = dartsPath+' '+segM({x:0,y:CP},{x:CH*0.92,y:CP});   // darts + chest line
  const hl={
    length: seg({x:0,y:ND},{x:0,y:L-0.5}),
    neckline: `M ${fmt2(T(HL))} C ${fmt2(T(neckL.c1))} ${fmt2(T(neckL.c2))} ${fmt2(T(G))} C ${fmt2(T(neckR.c1))} ${fmt2(T(neckR.c2))} ${fmt2(T(HR))}`,
    backneck: `M ${fmt2(T({x:-NWd*0.85,y:0}))} C ${fmt2(T({x:-NWd*0.3,y:BND}))} ${fmt2(T({x:NWd*0.3,y:BND}))} ${fmt2(T({x:NWd*0.85,y:0}))}`,
    shoulder: pair(HR,shC1,shC2,M),
    chest: seg({x:-CH,y:CP},{x:CH,y:CP}),
    waist: seg({x:-WH,y:L},{x:WH,y:L}),
    armhole: pair(M,ahC1,ahC2,E),
    side: pair(E,sdC1,sdC2,F),
    sleeve: pair(M,capC1,capC2,capO)+' '+pair(capO,cufC1,cufC2,slO)+' '+pair(slO,uaC1,uaC2,E),
    cap: pair(M,capC1,capC2,capO),
    mori: pair(capO,cufC1,cufC2,slO)+' '+pair(slO,uaC1,uaC2,E),
    darts: dartsPath,
    sew: wedge(dP,dS,1,'v')+' '+wedge(dV,dR,1,'v')+' '+wedge(dW,dX,1)+' '+wedge(dT,dQ,1.25,'h'),
    belt: `M ${fmt2(T(dV))} L ${fmt2(T(dT2))} L ${fmt2(T(dZ))}`
        + ` M ${fmt2(T(mir(dV)))} L ${fmt2(T(mir(dT2)))} L ${fmt2(T(dZ))}`,
    backdart: segM(dQ,{x:dQ.x,y:L-1}),
  };
  const tl=T({x:minX,y:minY}), br=T({x:maxX,y:maxY});
  return {base,hl,plain,fold:{y1:T({x:0,y:0}).y, y2:T({x:0,y:L}).y},
          box:{y0:Math.min(tl.y,br.y), y1:Math.max(tl.y,br.y)}};
}

/* ═══════════════════ TROUSERS (USHA Chapter 19) ══════════════════════
   नाप तालिका → FL, H, W, BL, B, PL.  Six parts:
     1 front · 2 back · 3 first belt · 4 second belt · 5 fly · 6 pocket
   Every point below is a literal reading of the chapter's numbered steps;
   the only geometric modelling is the shape of the curves the manual names
   ("french curve", "hip curve", "leg shaper"), which are built as exact
   quarter-ellipses / Catmull-Rom splines rather than eyeballed arcs.
   ═══════════════════════════════════════════════════════════════════ */
const TROUSER_CHART = {
  small:  {FL:38, H:32, W:30, BL:1.5, Bm:16, PL:13},
  medium: {FL:39, H:34, W:32, BL:1.5, Bm:18, PL:13},
  large:  {FL:40, H:36, W:34, BL:1.5, Bm:18, PL:13.5},
};
// exact circle→cubic constant: a quarter-round drawn with a French / hip curve
const KAPPA = 4/3*(Math.SQRT2-1);          // 0.5522847…
const f2 = (n)=>Number(n).toFixed(2);
// quarter-round: leaves `a` vertically, arrives at `b` horizontally
function qCtrl(a,b){ return [{x:a.x, y:a.y+KAPPA*(b.y-a.y)}, {x:b.x+KAPPA*(a.x-b.x), y:b.y}]; }
function qCurve(a,b){ const c=qCtrl(a,b);
  return `M ${f2(a.x)} ${f2(a.y)} C ${f2(c[0].x)} ${f2(c[0].y)} ${f2(c[1].x)} ${f2(c[1].y)} ${f2(b.x)} ${f2(b.y)}`; }
// hip curve between two points that both sit on a vertical run: vertical tangent
// at each end, so it degenerates to a true straight line when the x's agree
function vCurve(a,b){ const dy=(b.y-a.y)*0.5;
  return `M ${f2(a.x)} ${f2(a.y)} C ${f2(a.x)} ${f2(a.y+dy)} ${f2(b.x)} ${f2(b.y-dy)} ${f2(b.x)} ${f2(b.y)}`; }
const lin = (a,b)=>[{x:a.x+(b.x-a.x)/3,y:a.y+(b.y-a.y)/3},{x:a.x+2*(b.x-a.x)/3,y:a.y+2*(b.y-a.y)/3}];

/* ── the front skeleton: shared by Part 1, Part 2 (traced across) and the
      finished-trouser preview, so all three can never drift apart ── */
function trGeom(m){
  const SW=m.H/4+2, SH=m.FL-m.BL, hipY=m.H/3-1;          // 1.3 · 1.1 · 1.2
  const A={x:SW,y:0}, B={x:SW,y:SH}, C={x:SW,y:hipY}, D={x:0,y:hipY}, E={x:0,y:SH};
  const F={x:2,y:hipY}, G={x:2,y:0};                      // 2.1 · 2.2
  const K={x:2,y:0.5};                                    // 3.1
  const Lp={x:K.x+(m.W/4+0.5), y:K.y};                    // 3.3 · W/4+0.5
  const M={x:SW/2,y:hipY}, N={x:SW/2,y:SH};               // 4.1 · 4.2
  const O={x:SW,y:(hipY+SH)/2}, O1={x:SW,y:(hipY+SH)/2-2};// 5.1 · 5.2
  const P={x:O1.x-(m.H/4+2), y:O1.y};                     // 5.3 · H/4+2
  const Q={x:N.x-m.Bm/4,y:SH}, R={x:N.x+m.Bm/4,y:SH};     // 5.4 · B/4
  const kc=qCtrl(K,D);                                    // 3.2 french curve K→D
  return {SW,SH,hipY,A,B,C,D,E,F,G,K,Lp,M,N,O,O1,P,Q,R,kc};
}

    // ── Step 1 · back hip line ──

/* ═══ PARTS 3 & 4 · THE TWO BELTS (1 step each) ══════════════════════ */
function makeBelt(name, widthOf, extra, label){ return {
  name, cross:'', fold:false, scale:19, pad:40, mr:56, mb:34, foldDx:26,
  letters:{A:'A',B:'B',C:'C',D:'D'}, labs:{A:'r',B:'dr',C:'l',D:'dl'}, small:{},
  sheet:(m)=>({W:widthOf(m), H:m.BL}),
  points:(m)=>{ const SW=widthOf(m), SH=m.BL; return {
    A:{x:SW,y:0,s:1,gov:'origin',note:'belt end'},
    B:{x:SW,y:SH,s:1,gov:'BL',note:''},
    C:{x:0,y:0,s:1,gov:label,note:'belt width'},
    D:{x:0,y:SH,s:1,gov:'C↓BL',note:''},
  };},
  edges:(pt)=>{ const L=(a,b)=>`M ${f2(a.x)} ${f2(a.y)} L ${f2(b.x)} ${f2(b.y)}`;
    const ex={x:pt.A.x-extra,y:0};
    return [
      {id:'bl_top',s:1,color:'var(--accent)',from:'C',to:'A',d:L(pt.C,pt.A),gov:label},
      {id:'bl_bot',s:1,color:'var(--green)',from:'D',to:'B',d:L(pt.D,pt.B),gov:'C→D→B'},
      {id:'bl_end1',s:1,color:'var(--red)',from:'A',to:'B',d:L(pt.A,pt.B),gov:'BL'},
      {id:'bl_end2',s:1,color:'var(--red)',from:'C',to:'D',d:L(pt.C,pt.D),gov:'BL'},
      {id:'bl_extra',s:1,color:'var(--purple)',from:'A',to:'B',dash:true,d:L(ex,{x:ex.x,y:pt.B.y}),gov:`${extra}″ extra`},
    ];},
  steps:[{n:1,en:'Length & width',deps:[],formula:`A→B = BL · A→C = ${label} · ${extra}″ extra piece`}],
  dims:(pt,m,cur,sx,sy,SW,SH)=>{ let g='';
    g+=dimH(sx(0),sx(SW),sy(0)-18,`${label} = ${fmt(SW)}″`);
    g+=dimV(sx(SW)+38,sy(0),sy(SH),`BL = ${fmt(m.BL)}″`);
    g+=dimH(sx(SW-extra),sx(SW),sy(SH)+22,`${extra}″ extra`);
    return g; },
};}

/* ═══ FINISHED-TROUSER PREVIEW ═══════════════════════════════════════
   The flat garment is the Part-1 piece mirrored about the centre-front seam:
   half-waist = W/4+0.5, half-hip = H/4+2, knee and mori exactly as drafted.
   Nothing here is a free-hand proportion — every x and y is a corpus value. */
function trouserGarment(m){
  const H=m.H,W=m.W,FL=m.FL,BL=m.BL,B=m.Bm,PL=m.PL;
  const SWp=H/4+2, tl=FL-BL, hipY=H/3-1;
  // Laid flat, the half-width at any level is half the circumference there, i.e.
  // the mean of the front and back piece widths at that level. Front from Part 1,
  // back from Part 2 (which is the front plus H/16 at the fork, H/36 at the knee
  // and the mori). Nothing here is chosen — each is a drafted width:
  const wH   = W/4+0.5;                    //   K→L                    · waist
  const hH   = (SWp + (SWp+H/16))/2;       // ½(D→C + S→C1)            · crotch line
  const gap  = H/36;                       //   P→P1 = Q→T · the back leg is
  //   H/36 wider than the front on the inseam side, so laid flat the two legs
  //   cannot meet on the centre line — each sits H/36 clear of it.
  const kOut = gap + (SWp + (SWp+H/36))/2; // ½(P→O1 + P1→O1)          · knee
  const mOut = gap + (B/2 + (B/2+H/36))/2; // ½(Q→R + T→R)             · mori
  const crease = (gap+mOut)/2;             //   M→N bisects the mori
  const cy=hipY-0.5;                       // crotch line below the waist line
  const Ly=tl-0.5;                         // hem   below the waist line
  const ky=(hipY+tl)/2-2-0.5;              // knee  below the waist line
  const vy=cy+H/12;                        // U = M↓H/12 · where the legs part
  const mIn=gap, kIn=gap;                  // inner (inseam) edge of each leg
  const bH=BL;                             // the belt sits above the waist line
  const b2=(W/2+2.5)/2;                    // half of the second (back) belt
  const flyW=2, flyL=H/6+2;                // Part 5
  const dartX=(W/4+1.5)/2, dartL=H/6-1;    // Part 2 · Z is mid X–Y
  const pkW=7, pkR=H/12;                   // Part 6
  const ssC1={x:wH,y:cy*0.5}, ssC2={x:hH,y:cy*0.5};   // waist→hip, hip curve
  const P0={x:wH,y:-bH};
  const R=[
    {c:lin({x:wH,y:-bH},{x:wH,y:0}),         end:{x:wH,y:0}},        // belt side
    {c:[ssC1,ssC2],                          end:{x:hH,y:cy}},       // side seam
    {c:lin({x:hH,y:cy},{x:kOut,y:ky}),       end:{x:kOut,y:ky}},     // thigh
    {c:lin({x:kOut,y:ky},{x:mOut,y:Ly}),     end:{x:mOut,y:Ly}},     // to the mori
    {c:lin({x:mOut,y:Ly},{x:mIn,y:Ly}),      end:{x:mIn,y:Ly}},      // mori
    {c:lin({x:mIn,y:Ly},{x:kIn,y:ky}),       end:{x:kIn,y:ky}},     // inseam · lower
    {c:lin({x:kIn,y:ky},{x:0,y:vy}),         end:{x:0,y:vy}},        // inseam → crotch
  ];
  let segs=[['M',P0]];
  R.forEach(s=>segs.push(['C',s.c[0],s.c[1],s.end]));
  for(let i=R.length-1;i>=0;i--){ const s=R[i], start=i===0?P0:R[i-1].end;
    segs.push(['C',{x:-s.c[1].x,y:s.c[1].y},{x:-s.c[0].x,y:s.c[0].y},{x:-start.x,y:start.y}]); }
  segs.push(['Z']);
  const pts=[]; segs.forEach(s=>{ for(let i=1;i<s.length;i++) pts.push(s[i]); });
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const TW=126, TH=178, k=Math.min(TW/(maxX-minX), TH/(maxY-minY));
  const ox=70-((minX+maxX)/2)*k, oy=97-((minY+maxY)/2)*k;
  const T=p=>({x:p.x*k+ox, y:p.y*k+oy});
  const base=segs.map(s=> s[0]==='M'?`M ${fmt2(T(s[1]))}`: s[0]==='Z'?'Z'
    : `C ${fmt2(T(s[1]))} ${fmt2(T(s[2]))} ${fmt2(T(s[3]))}`).join(' ');
  const seg=(a,b)=>`M ${fmt2(T(a))} L ${fmt2(T(b))}`;
  const cub=(a,c1,c2,e)=>`M ${fmt2(T(a))} C ${fmt2(T(c1))} ${fmt2(T(c2))} ${fmt2(T(e))}`;
  const mir=p=>({x:-p.x,y:p.y});
  const segM=(a,b)=>seg(a,b)+' '+seg(mir(a),mir(b));
  const pair=(a,c1,c2,e)=>cub(a,c1,c2,e)+' '+cub(mir(a),mir(c1),mir(c2),mir(e));
  // fly: the same quarter-round the Part-1 draft uses for K→D, at fly length
  const fc=qCtrl({x:flyW,y:0},{x:0,y:flyL});
  const flyPath=cub({x:flyW,y:0},fc[0],fc[1],{x:0,y:flyL});
  // Pocket bag, exactly as Part 6 draws it: the fold A–B lies against the side
  // seam, the mouth starts 1″ in from C at E, and the whole free edge is the one
  // hip curve E→F→G — a sweep that eases into F with a vertical tangent and then
  // flows without a kink into the H/12 corner round F→G.
  const pkA={x:wH,y:0},        pkC={x:wH-pkW,y:0},
        pkE={x:wH-pkW+1,y:0},  pkD={x:wH-pkW,y:PL},
        pkF={x:wH-pkW,y:PL-pkR}, pkG={x:wH-pkW+pkR,y:PL}, pkB={x:wH,y:PL};
  const pg=qCtrl(pkF,pkG), dEF=pkF.y-pkE.y;
  const pkBag=(sgn)=>{ const S=p=>({x:sgn*p.x,y:p.y});
    return `M ${fmt2(T(S(pkE)))} `
         + `C ${fmt2(T(S({x:pkE.x,y:pkE.y+dEF*0.5})))} ${fmt2(T(S({x:pkF.x,y:pkF.y-dEF*0.5})))} ${fmt2(T(S(pkF)))} `
         + `C ${fmt2(T(S(pg[0])))} ${fmt2(T(S(pg[1])))} ${fmt2(T(S(pkG)))} `
         + `L ${fmt2(T(S(pkB)))} L ${fmt2(T(S(pkA)))} Z`; };
  const pkSheet=(sgn)=>{ const S=p=>({x:sgn*p.x,y:p.y});
    return `M ${fmt2(T(S(pkA)))} L ${fmt2(T(S(pkC)))} L ${fmt2(T(S(pkD)))} L ${fmt2(T(S(pkB)))} Z`; };
  const creasePath=segM({x:crease,y:cy},{x:crease,y:Ly});
  const plain = creasePath+' '+seg({x:-wH,y:0},{x:wH,y:0})+' '+flyPath
              + ' '+seg({x:0,y:cy},{x:0,y:vy});
  const hl={
    length:  seg({x:0,y:0},{x:0,y:Ly}),
    hip:     seg({x:-hH,y:cy},{x:hH,y:cy}),
    // The two K→D crotch curves are sewn face to face, so on the finished
    // trouser the whole front rise reads as the centre seam from waist to fork.
    // The back S→W→G1→X seat curve is the same seam seen from the other side.
    rise:    seg({x:0,y:0},{x:0,y:vy}),
    seat:    seg({x:0,y:0},{x:0,y:vy}),
    riseB:   seg({x:0,y:0},{x:0,y:vy}),   // the same seam, drafted from the back
    fly:     flyPath,
    waistF:  seg({x:-wH,y:0},{x:wH,y:0}),
    crotch:  pair({x:flyW,y:0},fc[0],fc[1],{x:0,y:flyL}),
    sideUp:  pair({x:wH,y:0},ssC1,ssC2,{x:hH,y:cy}),
    sideLow: segM({x:hH,y:cy},{x:kOut,y:ky})+' '+segM({x:kOut,y:ky},{x:mOut,y:Ly}),
    crease:  creasePath,
    thigh:   segM({x:hH,y:cy},{x:0,y:vy}),
    knee:    segM({x:kIn,y:ky},{x:kOut,y:ky}),
    mori:    segM({x:mIn,y:Ly},{x:mOut,y:Ly}),
    hem:     segM({x:mIn,y:Ly},{x:mOut,y:Ly}),
    side:    pair({x:wH,y:0},ssC1,ssC2,{x:hH,y:cy})+' '+segM({x:hH,y:cy},{x:kOut,y:ky})
             +' '+segM({x:kOut,y:ky},{x:mOut,y:Ly}),
    inseam:  segM({x:0,y:vy},{x:kIn,y:ky})+' '+segM({x:kIn,y:ky},{x:mIn,y:Ly}),
    belt1:   seg({x:-wH,y:-bH},{x:wH,y:-bH})+' '+seg({x:-wH,y:0},{x:wH,y:0})
             +' '+segM({x:wH,y:-bH},{x:wH,y:0}),
    belt2:   seg({x:-b2,y:-bH},{x:b2,y:-bH})+' '+seg({x:-b2,y:0},{x:b2,y:0})
             +' '+segM({x:b2,y:-bH},{x:b2,y:0}),
    dart:    segM({x:dartX,y:0},{x:dartX,y:dartL}),
    pocket:  pkBag(1)+' '+pkBag(-1),
    pocketsheet: pkSheet(1)+' '+pkSheet(-1),
    pocketm: segM(pkE,pkA),
  };
  return {base,hl,plain,
          fold:{y1:T({x:0,y:-bH}).y, y2:T({x:0,y:cy}).y},
          box:{y0:T({x:0,y:minY}).y, y1:T({x:0,y:maxY}).y}};
}

  edges:(pt,m)=>{ const L=(a,b)=>`M ${f2(a.x)} ${f2(a.y)} L ${f2(b.x)} ${f2(b.y)}`;
    const SH=m.L;
    const frontNeck = qCurve(pt.J,pt.Lp);
    const ax=pt.I.x-pt.M.x, ay=pt.I.y-pt.M.y, al=Math.hypot(ax,ay)||1, ux=ax/al, uy=ay/al;
    let nx=uy, ny=-ux; if(nx<0){nx=-nx;ny=-ny;}
    const ach=t=>({x:pt.M.x+t*ax,y:pt.M.y+t*ay}), c1=ach(.3), c2=ach(.72);
    const fc1={x:c1.x+0.9*nx,y:c1.y+0.9*ny}, fc2={x:c2.x+0.6*nx,y:c2.y+0.6*ny};
    const bc1={x:fc1.x-0.5*nx,y:fc1.y-0.5*ny}, bc2={x:fc2.x-0.5*nx,y:fc2.y-0.5*ny};
    const frontArm=`M ${f2(pt.M.x)} ${f2(pt.M.y)} C ${f2(fc1.x)} ${f2(fc1.y)} ${f2(fc2.x)} ${f2(fc2.y)} ${f2(pt.I.x)} ${f2(pt.I.y)}`;
    const backArm =`M ${f2(pt.M.x)} ${f2(pt.M.y)} C ${f2(bc1.x)} ${f2(bc1.y)} ${f2(bc2.x)} ${f2(bc2.y)} ${f2(pt.I.x)} ${f2(pt.I.y)}`;
    return [
      {id:'placket_fold',s:1,color:'var(--purple)',from:'A',to:'C',d:`M ${f2(pt.C.x)} 0 L ${f2(pt.C.x)} ${f2(SH)}`,gov:'1.5″ fold'},
      {id:'placket_overlap',s:1,color:'var(--purple)',from:'C',to:'E',dash:true,d:`M ${f2(pt.E.x)} 0 L ${f2(pt.E.x)} ${f2(SH)}`,gov:'0.5″ overlap'},
      {id:'chest_line',s:2,color:'var(--accent)',from:'I',to:'Hh',d:L(pt.I,pt.Hh),gov:'C/4+1.5'},
      {id:'open_edge',s:2,color:'var(--green)',from:'I',to:'I',dash:true,d:`M ${f2(pt.I.x)} ${f2(pt.I.y)} L 0 ${f2(SH)}`,gov:'open edge'},
      {id:'neck_width',s:3,color:'var(--text3)',from:'J',to:'E',d:L(pt.J,pt.E),gov:'C/12−0.7'},
      {id:'neck_box',s:3,color:'var(--text3)',from:'J',to:'K',dash:true,d:L(pt.J,pt.K),gov:'box'},
      {id:'neck_box2',s:3,color:'var(--text3)',from:'K',to:'Lp',dash:true,d:L(pt.K,pt.Lp),gov:'box'},
      {id:'front_neck',s:3,color:'var(--red)',from:'J',to:'Lp',man:true,d:frontNeck,gov:'french · J→L'},
      {id:'gn_ref',s:4,color:'var(--text3)',from:'G',to:'N',dash:true,d:L(pt.G,pt.N),gov:'G↓chest'},
      {id:'shoulder_seam',s:4,color:'var(--accent)',from:'J',to:'M',d:L(pt.J,pt.M),gov:'J→M · slope 1″'},
      {id:'front_armhole',s:5,color:'var(--red)',from:'M',to:'I',man:true,d:frontArm,gov:'front · right of split'},
      {id:'back_armhole',s:5,color:'var(--blue)',from:'M',to:'I',man:true,d:backArm,gov:'back · 0.5″ split'},
    ];},
  steps:SHIRT_FRONT_STEPS,
  dims:(pt,m,cur,sx,sy,SW,SH)=>{ let g='';
    if(cur===1){ g+=dimH(sx(pt.C.x),sx(pt.A.x),sy(0)-16,`1.5″ fold`);
                 g+=dimH(sx(pt.E.x),sx(pt.C.x),sy(0)-30,`0.5″ overlap`); }
    if(cur===2){ g+=dimH(sx(pt.G.x),sx(pt.E.x),sy(0)-16,`S/2 = ${fmt(m.S/2)}″`);
                 g+=dimV(sx(pt.Hh.x)+16,sy(0),sy(pt.Hh.y),`C/4 = ${fmt(m.C/4)}″`);
                 g+=dimH(sx(pt.I.x),sx(pt.Hh.x),sy(pt.Hh.y)+16,`C/4+1.5 = ${fmt(m.C/4+1.5)}″`); }
    if(cur===3){ g+=dimV(sx(pt.Lp.x)+14,sy(0),sy(pt.Lp.y),`C/12−0.7 = ${fmt(m.C/12-0.7)}″`);
                 g+=dimH(sx(pt.J.x),sx(pt.E.x),sy(0)-30,`C/12−0.7 = ${fmt(m.C/12-0.7)}″`); }
    if(cur===4){ g+=dimV(sx(pt.G.x)-14,sy(0),sy(pt.M.y),`1″`); }
    if(cur===5){ g+=`<text class="dimtxt" x="${sx(SW*0.4)}" y="${sy(SH*0.18)}" fill="var(--accent2)" text-anchor="middle">0.5″ split</text>`; }
    return g; },
};

function totalSteps(part){ return part.phases.reduce((a,p)=>a+p.steps.length,0); }
function resolve(part, gstep){ let acc=0;
  for(let i=0;i<part.phases.length;i++){ const p=part.phases[i];
    if(gstep<=acc+p.steps.length) return {phase:p, pIdx:i, local:gstep-acc};
    acc+=p.steps.length;
  }
  const last=part.phases[part.phases.length-1];
  return {phase:last, pIdx:part.phases.length-1, local:last.steps.length};
}

/* ═══ RENDER ══════════════════════════════════════════════════════════ */
const stage = document.getElementById('stage');
function fitBox(card, wrap, w, h, capScale){
  const pad = 52;
  const availW = Math.max(120, wrap.clientWidth - pad);
  const availH = Math.max(120, wrap.clientHeight - pad);
  const scale = Math.min(availW/w, availH/h, capScale||1.6);
  card.style.width = Math.round(w*scale)+'px';
  card.style.height = Math.round(h*scale)+'px';
}
function fitCard(w,h){
  fitBox(document.getElementById('canvas-card'), document.querySelector('.canvas-wrap'), w, h, 1.6);
}
let lastWH = {w:400,h:600};
window.addEventListener('resize', ()=>{
  fitCard(lastWH.w, lastWH.h);
  if(lastPreviewWH) fitBox(document.getElementById('preview-card'), document.querySelector('.preview-wrap'), lastPreviewWH.w, lastPreviewWH.h, 3.2);
});

function render(){
  const part=PARTS[state.part], m=state.m, gstep=state.step;
  const {phase:ph, pIdx, local:cur} = resolve(part, gstep);
  const pt=ph.points(m), edges=ph.edges(pt,m);
  const {W:SW,H:SH}=ph.sheet(m), SCALE=ph.scale, PAD=ph.pad;
  const w=SW*SCALE+PAD*2+ph.mr, h=SH*SCALE+PAD*2+ph.mb;
  lastWH = {w,h};
  fitCard(w,h);
  stage.setAttribute('viewBox',`0 0 ${w} ${h}`);
  stage.setAttribute('preserveAspectRatio','xMidYMid meet');
  const sx=x=>x*SCALE+PAD, sy=y=>y*SCALE+PAD;

  let g=`<defs><pattern id="grid" width="${SCALE}" height="${SCALE}" patternUnits="userSpaceOnUse">
      <path d="M ${SCALE} 0 L 0 0 0 ${SCALE}" fill="none" stroke="#20202a" stroke-width="1"/></pattern></defs>
    <rect width="${w}" height="${h}" fill="var(--bg)"/>
    <rect x="${sx(0)}" y="${sy(0)}" width="${SW*SCALE}" height="${SH*SCALE}" fill="url(#grid)" opacity=".85"/>
    <rect x="${sx(0)}" y="${sy(0)}" width="${SW*SCALE}" height="${SH*SCALE}" fill="rgba(245,158,11,0.05)" stroke="#33333d" stroke-width="1.4"/>`;
  if(ph.fold!==false) g+=`<text class="dimtxt" x="${sx(SW)+ph.foldDx}" y="${sy(SH/2)}" transform="rotate(-90 ${sx(SW)+ph.foldDx} ${sy(SH/2)})" fill="var(--purple)">${ph.foldLabel||'on fold'}</text>`;

  edges.forEach(e=>{ if(e.s>cur) return;
    const isNew=e.s===cur, dim=!isNew;
    const dd=e.d.replace(/(-?\d+\.?\d*) (-?\d+\.?\d*)/g,(_,a,b)=>`${sx(+a)} ${sy(+b)}`);
    g+=`<path id="${e.id}" data-phase="${pIdx+1}" data-step="${e.s}" data-from="${e.from}" data-to="${e.to}" data-formula="${e.gov}"${e.man?' data-manual="true"':''} `
      +`d="${dd}" fill="none" stroke="${e.color}" stroke-width="${isNew?2.8:1.6}" `
      +(e.dash?`stroke-dasharray="4,3" `:'')
      +`stroke-linecap="round" stroke-linejoin="round" opacity="${dim?0.4:1}"${isNew?' filter="drop-shadow(0 0 3px '+e.color+')"':''}/>`;
  });

  Object.entries(pt).forEach(([k,p])=>{ if(k[0]==='_'||p.s>cur) return;
    const isNew=p.s===cur, small=ph.small[k];
    const onFold=Math.abs(p.x-SW)<0.01;
    const dir=(ph.labs&&ph.labs[k]) || (onFold?'r':'l');
    const o=LAB[dir]||LAB.l; const px=sx(p.x), py=sy(p.y);
    const r=isNew?(small?3:4.2):(small?2.2:2.8);
    const govDy = o.dy<0 ? o.dy-9 : o.dy+9;
    g+=`<circle class="anchor${small?' small':''}${isNew?'':' dim'}" cx="${px}" cy="${py}" r="${r}"/>`;
    g+=`<text class="alabel${isNew?'':' dim'}" x="${px+o.dx}" y="${py+o.dy}" text-anchor="${o.a}">${ph.letters[k]||k}</text>`;
    if(isNew&&p.note&&!small) g+=`<text class="aform" x="${px+o.dx}" y="${py+govDy}" text-anchor="${o.a}">${p.gov}</text>`;
  });

  g += ph.dims(pt,m,cur,sx,sy,SW,SH);
  stage.innerHTML=g;

  renderDag(part); renderDots(part); renderGarment(part); renderInstructions(part);
  document.getElementById('garment-title').textContent=part.garmentTitle;
  document.getElementById('readout').innerHTML=`${ph.name} · <b>${cur}</b>/${ph.steps.length}`;
  document.getElementById('prev-btn').disabled=gstep===1;
  document.getElementById('next-btn').disabled=gstep===totalSteps(part);
  document.getElementById('tag').textContent=part.tag;
  const pct = Math.round((gstep/totalSteps(part))*100);
  document.getElementById('progress-fill').style.width = pct+'%';
  ['stage','instr','garment'].forEach(id=>{
    const el=document.getElementById(id); if(!el) return;
    el.classList.remove('step-in'); void el.offsetWidth; el.classList.add('step-in');
  });
}

function renderDag(part){
  const host=document.getElementById('dag-nodes'); host.innerHTML='';
  const multi=part.phases.length>1; let gi=0;
  part.phases.forEach((ph,pi)=>{
    if(multi){ const hd=document.createElement('div'); hd.className='phase-hdr';
      hd.innerHTML=`<span>${ph.name}</span><span class="pl"></span>`; host.appendChild(hd); }
    ph.steps.forEach((st,si)=>{ gi++; const g=gi;
      const n=document.createElement('div');
      n.className='node '+(g===state.step?'active':g<state.step?'done':'locked')+(si===0?' first':'');
      const deps=st.deps.map(d=>`<span class="chip dep">${d}</span>`).join('');
      const ct=(ph.cross!==undefined)?ph.cross:'needs Part 1 armhole';
      const cross=(pi>0&&si===0&&ct)?`<span class="chip cross">${ct}</span>`:'';
      n.innerHTML=`<div class="num">${st.n}</div>`+(st.man?`<div class="badge-man">✎</div>`:'')
        +`<div class="hi">${st.en}</div><div class="formula">${st.formula}</div>`
        +`<div class="chips">${st.deps.length?`<span class="chip">needs</span>${deps}`:'<span class="chip">root</span>'}${cross}${st.man?'<span class="chip man">manual</span>':''}</div>`;
      n.onclick=(gg=>()=>{state.step=gg;render();})(g);
      host.appendChild(n);
    });
  });
}
function renderDots(part){
  const host=document.getElementById('dots'); host.innerHTML=''; let gi=0;
  part.phases.forEach((ph,pi)=>{ ph.steps.forEach((st,si)=>{ gi++; const g=gi;
    const d=document.createElement('div');
    d.className='dot '+(g===state.step?'on':g<state.step?'done':'')+(pi>0&&si===0?' sep':'');
    d.onclick=(gg=>()=>{state.step=gg;render();})(g); host.appendChild(d);
  }); });
}
/* USHA manual convention: the whole garment is always drawn plain, and only the
   step's own line is inked in — over ONE side of it (the left). So the silhouette
   is never cut; the highlight is what gets clipped to the half. */
const CENTRE_IDS = { length:1, rise:1, riseB:1 };  // ids that ARE the centre line itself
const SECOND_CURVE = { backneck:1, riseB:1, dart:1 };  // drawn dashed — the far face of the garment
const WHOLE_IDS = { belt1:1, belt2:1 };     // separate pieces — not a folded half
// rough bbox of an SVG path from its coordinate pairs (control points give margin)
function pathBox(d){ const n=(d.match(/-?\d*\.?\d+/g)||[]).map(Number); let b=null;
  for(let i=0;i+1<n.length;i+=2){ const x=n[i],y=n[i+1];
    b = b ? {x0:Math.min(b.x0,x),y0:Math.min(b.y0,y),x1:Math.max(b.x1,x),y1:Math.max(b.y1,y)} : {x0:x,y0:y,x1:x,y1:y}; }
  return b||{x0:0,y0:0,x1:140,y1:200}; }
let lastPreviewWH = {w:140,h:200};
function renderGarment(part){ const st=part.garment.HL[state.step]||{ids:[],cap:''};
  const gm = part.garment.gen ? part.garment.gen(state.m) : {base:part.garment.base, hl:part.garment.hl};
  const cx=70, fold = gm.fold || part.garment.fold || {y1:30,y2:184};
  const bb=pathBox(gm.base);                                  // hug the drawing
  const left=Math.max(0,Math.round(bb.x0-5)), right=Math.min(140,Math.round(bb.x1+5));
  const top =Math.max(0,Math.round(Math.min(bb.y0,fold.y1)-6));
  const bot =Math.round(Math.max(bb.y1,fold.y2)+6);
  const VW=right-left, VH=bot-top;
  lastPreviewWH = {w:VW,h:VH};
  fitBox(document.getElementById('preview-card'), document.querySelector('.preview-wrap'), VW, VH, 3.2);
  let s=`<svg viewBox="${left} ${top} ${VW} ${VH}" style="width:100%;height:100%;display:block">`;
  // Which half of the preview was actually drafted? The kurti and blouse sheets
  // put the fold on the right, so the drafted half is the left one. The trouser
  // sheets are the other way round — the fork/centre edge is on the LEFT of the
  // draft and the side seam on the right — so the matching half of the finished
  // garment is the right leg. Clip to whichever half the phase drew.
  const hx = part.garment.half==='right' ? cx : left,
        hw = part.garment.half==='right' ? right-cx : cx-left;
  s+=`<defs><clipPath id="halfclip"><rect x="${hx}" y="${top}" width="${hw}" height="${VH}"/></clipPath></defs>`;
  // the garment, drawn whole and plain — never cut
  s+=`<path d="${gm.base}" fill="rgba(210,232,255,0.05)" stroke="#3a3a44" stroke-width="1.4" stroke-linejoin="round"/>`;
  // interior construction lines — always drawn plain, as the manual's thumbnails do
  if(gm.plain) s+=`<path d="${gm.plain}" fill="none" stroke="#3a3a44" stroke-width="0.9" stroke-linecap="round" opacity="0.8"/>`;
  // faint centre line (the fold), part of the plain drawing
  s+=`<line x1="${cx}" y1="${fold.y1}" x2="${cx}" y2="${fold.y2}" stroke="#3a3a44" stroke-width="1" stroke-dasharray="4,3"/>`;
  // the step's own line, inked over the left half only
  const ink=(d,col,dash)=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.6" `
    +`stroke-linecap="round"${dash} filter="drop-shadow(0 0 3px ${col})"/>`;
  let half='', whole='';
  st.ids.forEach(id=>{ const d=gm.hl[id]; if(!d) return;
    const dash = SECOND_CURVE[id]?' stroke-dasharray="4,3"':'';
    if(CENTRE_IDS[id]){ whole+=ink(d,'var(--purple)',dash); return; } // sits on the centre line
    if(WHOLE_IDS[id]){ whole+=ink(d,'var(--red)',dash); return; }    // a whole separate piece
    half+=ink(d,'var(--red)',dash);
  });
  if(half)  s+=`<g clip-path="url(#halfclip)">${half}</g>`;
  if(whole) s+=whole;
  s+=`</svg>`;
  document.getElementById('garment').innerHTML=s;
  document.getElementById('garment-cap').textContent=st.cap;
}
function renderInstructions(part){
  const {phase:ph, local:cur}=resolve(part, state.step);
  const v=V(state.m);
  const set=ph.instr||{}; const step=set[cur]||{};
  let draft=(step.draft?step.draft(v,state.m):[]);
  let sew=(step.sew?step.sew(v,state.m):null);
  let tip=(step.tip?step.tip(v,state.m):null);
  if(state.namesMode){
    const pt = ph.points(state.m);
    const names = buildNames(ph, pt);
    draft = draft.map(d=>humanize(d,names));
    if(sew) sew = humanize(sew,names);
    if(tip) tip = humanize(tip,names);
  }
  const head = `${ph.name} · step ${cur} / ${ph.steps.length}`;
  const paint = (d,s,t,h)=>{
    let html=`<div class="instr-head">${h}</div>`;
    html+='<ol class="instr-list">'+d.map(x=>`<li>${x}</li>`).join('')+'</ol>';
    if(s) html+=`<div class="instr-sew"><b>✂ Stitch</b> ${s}</div>`;
    if(t) html+=`<div class="instr-tip"><b>💡 Tip</b> ${t}</div>`;
    document.getElementById('instr').innerHTML=html;
  };
  paint(draft, sew, tip, head);
  if(state.lang!=='en'){
    const myStep=state.step, myPart=state.part, myLang=state.lang;
    document.getElementById('instr').classList.add('lang-loading');
    Promise.all([
      Promise.all(draft.map(d=>translateText(d,myLang))),
      sew ? translateText(sew,myLang) : Promise.resolve(null),
      tip ? translateText(tip,myLang) : Promise.resolve(null),
      translateText(head,myLang),
    ]).then(([d2,s2,t2,h2])=>{
      if(state.step!==myStep || state.part!==myPart || state.lang!==myLang) return; // stale — user moved on
      paint(d2,s2,t2,h2);
      if(lastTranslateError){
        document.getElementById('instr').insertAdjacentHTML('beforeend',
          `<div class="instr-warn">⚠ ${lastTranslateError}</div>`);
      }
    }).finally(()=>{ document.getElementById('instr').classList.remove('lang-loading'); });
  }
}
function renderFields(){
  const part=PARTS[state.part];
  const host=document.getElementById('measure');
  const presets=['small','medium','large'].map(k=>
    `<button class="preset${state.size===k?' active':''}" data-size="${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('');
  const ov=part.fieldLabels||{};
  const fields=ALL_FIELDS.filter(f=>part.uses.includes(f.id)).map(f=>
    `<div class="field"><label>${ov[f.id]||f.label}<span class="ex">${f.ex}</span></label>
     <input type="number" step="0.5" data-id="${f.id}" value="${state.m[f.id]}"/></div>`).join('');
  host.innerHTML=`<div class="preset-row">${presets}</div><div class="fields-grid">${fields}</div>`;
  host.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{
    const k=b.dataset.size; state.size=k; state.m={...CHARTS[part.chart][k]}; renderFields(); render();
  });
  host.querySelectorAll('input[data-id]').forEach(inp=>inp.addEventListener('input',e=>{
    state.m[e.target.dataset.id]=parseFloat(e.target.value)||0;
    if(state.size!=='custom'){ state.size='custom'; host.querySelectorAll('.preset').forEach(b=>b.classList.remove('active')); }
    render();
  }));
}

document.getElementById('switch').addEventListener('click',e=>{
  const b=e.target.closest('.sw-btn'); if(!b) return;
  document.querySelectorAll('.sw-btn').forEach(x=>x.classList.toggle('active',x===b));
  state.part=b.dataset.part; state.step=1;
  state.m={...CHARTS[PARTS[state.part].chart].large}; state.size='large';
  document.getElementById('dag-title').textContent = PARTS[state.part].label+' — DAG';
  renderFields(); render();
});
// Escape the header's stacking context entirely (backdrop-filter on an ancestor
// silently turns position:fixed descendants into something scoped to that
// ancestor, so z-index stops working against later page content) by moving
// the menu to be a direct child of <body> once, up front.
document.body.appendChild(document.getElementById('lang-menu'));

function positionLangMenu(){
  const menu = document.getElementById('lang-menu');
  const sidebar = document.querySelector('aside.info');
  const btn = document.getElementById('lang-toggle');
  const sb = sidebar.getBoundingClientRect(), bb = btn.getBoundingClientRect();
  // full-width match to the sidebar it sits above, so nothing behind it can peek out
  menu.style.left = sb.left+'px';
  menu.style.width = sb.width+'px';
  menu.style.top = (bb.bottom+8)+'px';
  menu.style.maxHeight = (window.innerHeight - bb.bottom - 24)+'px';
}
document.getElementById('lang-toggle').addEventListener('click',(e)=>{
  e.stopPropagation();
  const wrap=document.getElementById('lang-wrap');
  const menu=document.getElementById('lang-menu');
  const opening = !menu.classList.contains('open');
  wrap.classList.toggle('open', opening);
  menu.classList.toggle('open', opening);
  if(opening) positionLangMenu();
});
window.addEventListener('resize', ()=>{ if(document.getElementById('lang-menu').classList.contains('open')) positionLangMenu(); });
document.getElementById('lang-menu').addEventListener('click',(e)=>{
  const b=e.target.closest('.lang-opt'); if(!b) return;
  document.querySelectorAll('.lang-opt').forEach(x=>x.classList.toggle('active',x===b));
  state.lang = b.dataset.lang;
  document.getElementById('lang-current').textContent = b.dataset.label;
  document.getElementById('lang-wrap').classList.remove('open');
  document.getElementById('lang-menu').classList.remove('open');
  renderInstructions(PARTS[state.part]);
});
document.addEventListener('click',(e)=>{
  const wrap=document.getElementById('lang-wrap');
  const menu=document.getElementById('lang-menu');
  if(menu.classList.contains('open') && !wrap.contains(e.target) && !menu.contains(e.target)){
    wrap.classList.remove('open');
    menu.classList.remove('open');
  }
});
document.getElementById('names-toggle').addEventListener('click',()=>{
  state.namesMode=!state.namesMode;
  document.getElementById('names-toggle').classList.toggle('on',state.namesMode);
  document.getElementById('names-toggle-label').textContent = state.namesMode ? 'Original names' : 'Letters';
  renderInstructions(PARTS[state.part]);
});
document.getElementById('prev-btn').onclick=()=>{if(state.step>1){state.step--;render();}};
document.getElementById('next-btn').onclick=()=>{const n=totalSteps(PARTS[state.part]); if(state.step<n){state.step++;render();}};
window.addEventListener('keydown',e=>{const n=totalSteps(PARTS[state.part]);
  if(e.key==='ArrowRight'&&state.step<n){state.step++;render();}
  if(e.key==='ArrowLeft'&&state.step>1){state.step--;render();}});

// --- SILAI: read initial garment + size from the host page (RoopVana) ------
// Mirrors exactly what the switcher (.sw-btn) and size-preset (.preset)
// click handlers above already do to state.part/state.size/state.m, so
// launching straight into a specific garment/size behaves identically to a
// person clicking those buttons themselves. Query string only (no
// postMessage): ?part=kurta_sleeve|kurta_sleeveless|blouse|trousers|shirt
// and ?size=small|medium|large.
(function(){
  const params = new URLSearchParams(window.location.search);
  const requestedPart = params.get('part');
  const requestedSize = params.get('size');

  if (requestedPart && PARTS[requestedPart]) {
    document.querySelectorAll('.sw-btn').forEach(x =>
      x.classList.toggle('active', x.dataset.part === requestedPart));
    state.part = requestedPart;
    state.step = 1;
  }

  const chartForPart = CHARTS[PARTS[state.part].chart];
  const sizeKey = (requestedSize && chartForPart[requestedSize]) ? requestedSize : state.size;
  state.m = { ...chartForPart[sizeKey] };
  state.size = sizeKey;
})();

document.getElementById('dag-title').textContent=PARTS[state.part].label+' — DAG';
renderFields(); render();
</script>
</body>
